  merge-artifacts:
    name: 合并所有架构库
    needs:
      - build-android-x86_64
      - build-android-arm64-v8a
      - build-android-x86
      - build-android-armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: MobileGL-android-*
          path: ${{ github.workspace }}/downloaded
          merge-multiple: true

      - name: 列出下载内容
        run: |
          echo "下载目录内容:"
          ls -la ${{ github.workspace }}/downloaded
          echo "工作空间根目录内容:"
          ls -la ${{ github.workspace }}

      - name: 检查是否存在已合并的压缩包
        id: check
        run: |
          set -euxo pipefail
          FOUND_FILE=$(find ${{ github.workspace }}/downloaded -name "MobileGL-android-all.zip" -type f | head -n1)
          if [ -n "$FOUND_FILE" ]; then
            echo "找到已存在的压缩包: $FOUND_FILE"
            cp "$FOUND_FILE" ${{ github.workspace }}/MobileGL-android-all.zip
            echo "已复制到工作空间根目录"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "未找到已存在的压缩包"
            echo "found=false" >> $GITHUB_OUTPUT
          fi
          echo "当前工作空间根目录内容:"
          ls -la ${{ github.workspace }}

      - name: 上传已存在的压缩包
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-all
          path: ${{ github.workspace }}/MobileGL-android-all.zip
          if-no-files-found: error

      - name: 直接上传合并后的 lib 目录
        if: steps.check.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-all
          path: ${{ github.workspace }}/downloaded/lib
          if-no-files-found: error
