name: 构建MobileGL_Android全架构

on:
  push:
    branches: [ dev, release/* ]
    tags: [ "v*" ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  ANDROID_API: 29
  NDK_VERSION: r29

jobs:
  build-android:
    name: 构建 ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a, x86_64, x86 ]

    steps:
      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: 获取 CMake
        uses: lukka/get-cmake@latest

      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 unzip

      - name: 安装 Android NDK
        run: |
          set -euxo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
          curl -L --retry 3 --retry-delay 2 -o "${NDK_ZIP}" "${NDK_URL}"
          unzip -q "${NDK_ZIP}" -d "${HOME}"
          NDK_PATH="${HOME}/android-ndk-${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "已安装 NDK 到: ${NDK_PATH}"

      - name: 更新 glslang 外部源码
        working-directory: ${{ github.workspace }}/3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: 配置 CMake
        run: |
          cmake -S . -B build-${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DMOBILEGL_ANDROID_NO_STD_FORMAT=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DCMAKE_C_FLAGS="-O3 -fno-lto" \
            -DCMAKE_CXX_FLAGS="-O3 -fno-lto" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fno-lto" \
            -DCMAKE_EXE_LINKER_FLAGS="-fno-lto" \
            -DBUILD_SHARED_LIBS=OFF \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF

      - name: 编译
        run: cmake --build build-${{ matrix.abi }} --parallel $(nproc)

      - name: 收集产物
        run: |
          set -euxo pipefail
          OUT_DIR="artifacts/lib/${{ matrix.abi }}"
          mkdir -p "$OUT_DIR"
          SO_FILE=$(find "build-${{ matrix.abi }}" -name "libMobileGL.so" -type f | head -n1 || true)
          if [ -z "$SO_FILE" ]; then
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
          cp "$SO_FILE" "$OUT_DIR/libMobileGL.so"

      - name: 验证依赖
        run: |
          set -euxo pipefail
          SO="artifacts/lib/${{ matrix.abi }}/libMobileGL.so"
          "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$SO" | grep NEEDED || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-${{ matrix.abi }}
          path: artifacts/lib/${{ matrix.abi }}/libMobileGL.so
          if-no-files-found: error

  merge:
    name: 合并所有架构库
    needs: [ build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: MobileGL-android-*
          path: downloaded
          merge-multiple: false

      - name: 列出下载内容
        run: ls -R downloaded

      - name: 归一化目录并打包 ZIP
        run: |
          set -euxo pipefail
          STAGE="${{ github.workspace }}/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib"
          for artifact_dir in downloaded/*; do
            [ -d "$artifact_dir" ] || continue
            abi="${artifact_dir#downloaded/MobileGL-android-}"
            so_file="$artifact_dir/libMobileGL.so"
            if [ -f "$so_file" ]; then
              mkdir -p "$STAGE/lib/$abi"
              cp "$so_file" "$STAGE/lib/$abi/libMobileGL.so"
            else
              echo "警告: $artifact_dir 中没有 libMobileGL.so"
            fi
          done
          cd "$STAGE"
          zip -r "${{ github.workspace }}/MobileGL-android-all.zip" lib

      - name: 上传合并后的压缩包
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-all
          path: MobileGL-android-all.zip
          if-no-files-found: error
