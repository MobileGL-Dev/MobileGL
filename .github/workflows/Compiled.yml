          if-no-files-found: error

  build-x86:
    name: x86
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}
    steps:
      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取 CMake
        uses: lukka/get-cmake@latest
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          sudo apt-get update
          sudo apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev
      - name: 安装 32 位依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: 配置 CMake
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-x86
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86.so
          if-no-files-found: error

  build-armeabi-v7a:
    name: armeabi-v7a
    runs-on: ubuntu-latest
    container:
      image: arm32v7/ubuntu:22.04
      options: --platform=linux/arm/v7 --user root  # 以 root 用户运行容器
    env:
      BUILD_ROOT: ${{ github.workspace }}
    steps:
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 安装基础工具（容器内）
        run: |
          apt-get update
          apt-get install -y wget gnupg lsb-release software-properties-common
          apt-get install -y cmake ninja-build python3 git
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          apt-get update
          apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev
      - name: 显示工具链信息
        run: |
          clang-20 --version
          uname -m
      - name: 配置 CMake
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-armeabi-v7a.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-armeabi-v7a
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-armeabi-v7a.so
          if-no-files-found: error