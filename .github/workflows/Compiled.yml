name: 构建 MobileGL

on:
  push:
    branches:
      - dev
      - release/*
    tags:
      - v*
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-x86_64:
    name: x86_64
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}
    steps:
      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取 CMake
        uses: lukka/get-cmake@latest
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          sudo apt-get update
          sudo apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev
      - name: 配置 CMake
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86_64.so"
            echo "已生成共享库: libMobileGL-x86_64.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-x86_64
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86_64.so
          if-no-files-found: error

