          if-no-files-found: error

  build-x86:
    name: x86
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}
    steps:
      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取 CMake
        uses: lukka/get-cmake@latest
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          sudo apt-get update
          sudo apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev
      - name: 安装 32 位依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
      - name: 配置 CMake
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86.so"
            echo "已生成共享库: libMobileGL-x86.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-x86
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-x86.so
          if-no-files-found: error

  build-armeabi-v7a:
    name: armeabi-v7a
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}
    steps:
      - name: 设置交换空间（128GB）
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 128
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取 CMake
        uses: lukka/get-cmake@latest
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          sudo apt-get update
          sudo apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev
      - name: 安装 ARM 交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: 设置 Ninja 并行上限
        run: echo "CMAKE_BUILD_PARALLEL_LEVEL=2" >> $GITHUB_ENV
      - name: 配置 CMake（交叉编译，强制禁用 LTO，使用 lld）
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          rm -rf build
          cmake -S . -B build --fresh \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_FLAGS="--target=arm-linux-gnueabihf -fno-lto" \
            -DCMAKE_CXX_FLAGS="--target=arm-linux-gnueabihf -fno-lto" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=arm-linux-gnueabihf -fno-lto -fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS="--target=arm-linux-gnueabihf -fno-lto -fuse-ld=lld" \
            -DCMAKE_MODULE_LINKER_FLAGS="--target=arm-linux-gnueabihf -fno-lto -fuse-ld=lld" \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -fno-lto" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fno-lto" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DGLSLANG_LTO=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译（并行 2 线程 + 详细输出）
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: |
          set -euxo pipefail
          cmake --build . --parallel 2 --verbose
      - name: 打印系统资源状态（排查 OOM）
        if: always()
        run: |
          echo "== free -h =="
          free -h || true
          echo "== df -h =="
          df -h || true
          echo "== dmesg (OOM?) =="
          sudo dmesg -T | tail -n 200 || true
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-armeabi-v7a.so"
            echo "已生成共享库: libMobileGL-armeabi-v7a.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-armeabi-v7a
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-armeabi-v7a.so
          if-no-files-found: error