  merge-artifacts:
    name: 合并所有架构库
    needs:
      - build-android-x86_64
      - build-android-arm64-v8a
      - build-android-x86
      - build-android-armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: MobileGL-android-*
          path: ${{ github.workspace }}/downloaded
          merge-multiple: true

      - name: 列出下载内容
        run: |
          echo "下载目录内容:"
          ls -la ${{ github.workspace }}/downloaded
          echo "工作空间根目录内容:"
          ls -la ${{ github.workspace }}

      - name: 归一化目录并打包为 ZIP
        run: |
          set -euxo pipefail
          STAGE="${{ github.workspace }}/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib"
          if [ -d "${{ github.workspace }}/downloaded/lib" ]; then
            cp -a "${{ github.workspace }}/downloaded/lib/." "$STAGE/lib/"
          fi
          if [ -d "${{ github.workspace }}/downloaded/artifacts/lib" ]; then
            cp -a "${{ github.workspace }}/downloaded/artifacts/lib/." "$STAGE/lib/"
          fi
          cd "$STAGE"
          zip -r "${{ github.workspace }}/MobileGL-android-all.zip" lib

      - name: 上传合并后的压缩包
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-all
          path: ${{ github.workspace }}/MobileGL-android-all.zip
          if-no-files-found: error
