name: 构建 MobileGL

on:
  push:
    branches:
      - dev
      - release/*
    tags:
      - v*
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-latest
            container: null
            cmake_flags: ""
            deps: ""
          - arch: arm64-v8a
            runs_on: ubuntu-24.04-arm
            container: null
            cmake_flags: ""
            deps: ""
          - arch: x86
            runs_on: ubuntu-latest
            container: null
            cmake_flags: -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32"
            deps: gcc-multilib g++-multilib libc6-dev-i386
          - arch: armeabi-v7a
            runs_on: ubuntu-latest
            container:
              image: arm32v7/ubuntu:22.04
              options: --platform=linux/arm/v7
            cmake_flags: ""
            deps: ""
      fail-fast: false

    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    env:
      BUILD_ROOT: ${{ github.workspace }}
      ARCH: ${{ matrix.arch }}

    steps:
      # 对容器架构启用 QEMU 模拟（必须在容器启动前运行）
      - name: 设置 QEMU
        if: matrix.container != null
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm/v7

      - name: 设置交换空间（宿主机）
        if: matrix.arch != 'arm64-v8a'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 32

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true

      # 容器内需安装基础工具
      - name: 安装基础工具（容器环境）
        if: matrix.container != null
        run: |
          apt-get update
          apt-get install -y wget gnupg lsb-release software-properties-common
          apt-get install -y cmake ninja-build python3 git

      - name: 获取 CMake（非容器环境）
        if: matrix.container == null
        uses: lukka/get-cmake@latest

      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: 安装 Clang 20
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
          add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-20 main"
          apt-get update
          apt-get install -y clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev

      - name: 安装架构特定依赖（仅交叉编译架构）
        if: matrix.deps != ''
        run: |
          apt-get update
          apt-get install -y ${{ matrix.deps }}

      - name: 显示工具链信息
        run: |
          clang-20 --version
          clang++-20 --version
          uname -m

      # 与文档构建指令完全一致，仅追加架构必需标志（交叉编译）
      - name: 配置 CMake
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF \
            ${{ matrix.cmake_flags }}

      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)

      # 仅收集 libMobileGL.so，不包含头文件
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f)
          if [ -z "$SO_FILE" ]; then
            SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so.*" -type f | head -n1)
          fi
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/libMobileGL-${{ matrix.arch }}.so"
            echo "已生成共享库: libMobileGL-${{ matrix.arch }}.so"
          else
            echo "::error::未找到 libMobileGL.so 文件"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-linux-${{ matrix.arch }}
          path: ${{ env.BUILD_ROOT }}/artifacts/libMobileGL-${{ matrix.arch }}.so
          if-no-files-found: error