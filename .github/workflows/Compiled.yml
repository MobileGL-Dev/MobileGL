name: 构建 MobileGL

on:
  push:
    branches:
      - dev
      - release/*
    tags:
      - v*
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-android-x86_64:
    name: android-x86_64
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: ${{ github.workspace }}
      ARCH: x86_64
      ANDROID_ABI: x86_64
      ANDROID_API: 21
    steps:
      - name: 设置交换空间
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 获取 CMake
        uses: lukka/get-cmake@latest
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
      - name: 下载 Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK=${{ github.workspace }}/android-ndk-r26d" >> $GITHUB_ENV
      - name: 更新 glslang 外部源码
        working-directory: ${{ env.BUILD_ROOT }}/3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: 配置 CMake (Android)
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ANDROID_ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DBUILD_SHARED_LIBS=ON \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF
      - name: 编译
        working-directory: ${{ env.BUILD_ROOT }}/build
        run: cmake --build . --parallel $(nproc)
      - name: 收集构建产物
        run: |
          mkdir -p ${{ env.BUILD_ROOT }}/artifacts/lib/${{ env.ARCH }}
          SO_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libMobileGL.so" -type f | head -n1)
          if [ -n "$SO_FILE" ]; then
            cp "$SO_FILE" "${{ env.BUILD_ROOT }}/artifacts/lib/${{ env.ARCH }}/libMobileGL.so"
          else
            echo "::error::未找到 libMobileGL.so"
            exit 1
          fi
          GLSLANG_FILE=$(find ${{ env.BUILD_ROOT }}/build -name "libglslang.so" -type f | head -n1)
          if [ -n "$GLSLANG_FILE" ]; then
            cp "$GLSLANG_FILE" "${{ env.BUILD_ROOT }}/artifacts/lib/${{ env.ARCH }}/libglslang.so"
          else
            echo "::error::未找到 libglslang.so"
            exit 1
          fi
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MobileGL-android-${{ env.ARCH }}
          path: ${{ env.BUILD_ROOT }}/artifacts
          if-no-files-found: error

