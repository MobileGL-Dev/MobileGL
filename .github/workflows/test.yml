name: Test

on:
  push:
    branches:
      - dev
      - Feat/Backend-Direct-GLES
      - Feat/Backend-Direct-Vulkan
      # TEMPORARY, remove before merging the MGPipe work into dev: the disaggregation
      # branch runs the full lane on every push so a phase's landing is not gated on
      # someone remembering to dispatch the workflow by hand.
      - feat/disaggregated
      - codex/fix-github-ci
      - cleanup
  workflow_dispatch:

env:
  # Software-rendered CI submissions may exceed the interactive GPU hang budget.
  MOBILEGL_GPU_HANG_BUDGET_MS: "0"

# ONE LIVE RUN PER BRANCH. The disaggregation branch pushes (often docs-only) commits minutes apart
# and each push fans out to ~330 retrace legs here and ~275 jobs in apk.yml; with no group, runs
# sat queued for 10+ hours behind their own successors. A manual dispatch gets a group of its own,
# so a push never cancels a manually started run; dev queues rather
# than cancels. No paths-ignore here, unlike apk.yml: this workflow hosts the doc citation lint.
# The "hosted" key leaves behind runs queued for the retired self-hosted runner, which cannot drain.
concurrency:
  group: ${{ github.workflow }}-hosted-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/dev' }}

defaults:
  run:
    shell: bash

jobs:
  # Temporarily keep all CI on GitHub-hosted runners while WSL D3D12 readback hangs are investigated.
  build-linux:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    outputs:
      split-identical: ${{ steps.split-guard.outputs.identical }}
      link-ratchet: ${{ steps.ratchet.outcome }}
    env:
      BUILD_DIR: build-linux
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-

      - name: Prepare Vulkan SDK
        id: netsetup77
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup77.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Install build dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build

      - name: Show installed toolchain
        run: |
          ccache --version
          "${MOBILEGL_CI_CC}" --version
          "${MOBILEGL_CI_CXX}" --version
          "${MOBILEGL_CI_LLD}" --version
          dpkg -l 'libc++*' 'libegl*' 'libgles*' 'mesa*' 'vulkan*' || true

      # The configure line lives in scripts/ci/configure_build.sh, shared with build-linux-split.
      - name: Configure CMake
        env:
          CI_BUILD_TYPE: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' && 'Debug' || 'Release' }}
        run: bash scripts/ci/configure_build.sh primary "${BUILD_DIR}"

      # On the disaggregation branches build-linux-split configures the same sources with only the
      # benchmarks left out. This configures its line here as a probe, on this runner, and compares
      # the two trees (scripts/ci/build_fingerprint.py). Equal means the split consumers take this
      # job's artifacts; a difference, or a guard that cannot decide, means false, and
      # build-linux-split builds its own as before. It never reds this job.
      - name: Split configuration guard
        id: split-guard
        if: env.MOBILEGL_CI_DISAGGREGATED == 'ON'
        run: |
          if python3 scripts/ci/build_fingerprint.py --self-test > "${RUNNER_TEMP}/fingerprint-self-test.txt"; then
            python3 scripts/ci/build_fingerprint.py guard --built "${BUILD_DIR}" --probe split \
              --probe-dir build-guard-split --github-output identical || echo "identical=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/fingerprint-self-test.txt"
            echo "::warning::build_fingerprint.py's self-test failed, so the split build is not reused"
            echo "identical=false" >> "${GITHUB_OUTPUT}"
          fi
          rm -rf build-guard-split

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)"

      - name: Primary runtime mode proof
        run: |
          python3 scripts/ci/runtime_mode_proof.py self-test
          mode=monolith
          if [ "${MOBILEGL_CI_DISAGGREGATED}" = "ON" ]; then mode=disaggregated; fi
          python3 scripts/ci/runtime_mode_proof.py build --build-dir "${BUILD_DIR}" \
            --mode "${mode}" --output "${BUILD_DIR}/runtime-mode.json"

      # build-linux-split's server link-closure ratchet, run on this build when that job reuses it.
      # continue-on-error keeps a ratchet red from skipping this job's consumers; integration-split
      # turns it into a red of its own instead (Split runtime agreement).
      - name: Server link-closure ratchet
        id: ratchet
        if: steps.split-guard.outputs.identical == 'true'
        continue-on-error: true
        run: |
          mkdir -p ci-artifacts
          python3 scripts/link_ratchet.py --self-test
          python3 scripts/link_ratchet.py \
            --build-dir "${BUILD_DIR}" \
            --baseline scripts/data/link_ratchet_baseline.txt \
            --assert-monotone \
            --bucket \
            --json ci-artifacts/link-ratchet.json

      - name: Upload link ratchet
        if: ${{ always() && steps.split-guard.outputs.identical == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: link-ratchet
          path: ci-artifacts/link-ratchet.json
          if-no-files-found: warn
          overwrite: true

      - name: Show ccache stats
        if: ${{ always() }}
        run: ccache --show-stats

      # Rewrite one rolling entry per job and branch. The upload stays cumulative - it
      # carries every object restored at the top of this run plus the few TUs that
      # changed - but Actions cache keys are immutable, so this branch's superseded
      # blob is released first; --ref keeps the delete off other branches' entries.
      # Running after the build means a failed build leaves the entry untouched.
      - name: Release superseded ccache entry
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" --ref "${GITHUB_REF}" || true

      - name: Save ccache
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1

      - name: Prepare packaged test metadata
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package Linux runtime
        run: |
          mkdir -p ci-artifacts
          mapfile -t SHARED_LIBS < <(find "${BUILD_DIR}" -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          tar \
            --exclude='*/CMakeFiles' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ninja*' \
            --exclude='build.ninja' \
            --exclude='cmake_install.cmake' \
            --zstd -cf ci-artifacts/mobilegl-linux-runtime.tar.zst \
            "${BUILD_DIR}/runtime-mode.json" \
            "${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/CTestTestfile.cmake" \
            "${BUILD_DIR}/MobileGL/MG_Test" \
            "${BUILD_DIR}/MobileGL/MG_Benchmark" \
            "${BUILD_DIR}/MobileGL/MG_IntegrationTest" \
            "${SHARED_LIBS[@]}"

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-runtime
          path: ci-artifacts/mobilegl-linux-runtime.tar.zst
          if-no-files-found: error

      # The retrace legs load only the library, and the server image on the spawn arm, so they
      # take this instead of the whole test runtime.
      - name: Package retrace library
        run: |
          files=("${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/libMobileGL.so")
          if [ -f "${BUILD_DIR}/libMobileGLServer.so" ]; then files+=("${BUILD_DIR}/libMobileGLServer.so"); fi
          tar -czf ci-artifacts/mobilegl-linux-lib.tgz "${files[@]}"

      - name: Upload retrace library
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-lib
          path: ci-artifacts/mobilegl-linux-lib.tgz
          if-no-files-found: error

  # The shipped shape: a library with no MG_Remote, which FCL embeds. On the disaggregation
  # branches the primary artifact carries the transport, so this is the only build of that shape
  # there; retrace-shipped replays it.
  build-linux-monolith-control:
    name: build push monolith control (no MG_Remote)
    runs-on: ubuntu-26.04
    env:
      BUILD_DIR: build-push-control
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_NOHASHDIR: "true"
    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10
      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-build-linux-ccache-v1
      - name: Prepare Vulkan SDK
        id: netsetup230
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup230.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py
      - name: Install build dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build
      # The push monolith without MG_Remote, the shape FCL embeds. Its runtime_mode_proof is the
      # zero-MG_Remote-symbol check: a push library that links any MG_Remote symbol is red here.
      # Its library is uploaded for retrace-shipped, a positive replay of that shape.
      - name: Configure push control without MG_Remote
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_C_COMPILER="${MOBILEGL_CI_CC}" -DCMAKE_CXX_COMPILER="${MOBILEGL_CI_CXX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release -DMOBILEGL_LOG_ACTIVE_LEVEL=MOBILEGL_LOG_LEVEL_INFO \
            -DMOBILEGL_BUILD_TEST=OFF -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DMOBILEGL_BUILD_INTEGRATION_TEST=OFF -DMOBILEGL_BUILD_TRACE_REPLAY=OFF \
            -DMOBILEGL_BUILD_DISAGGREGATED=OFF -DMOBILEGL_BUILD_DISAGGREGATED_INPROC=OFF \
            -DMOBILEGL_PIPE_VERIFY=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build push control and prove it has zero MG_Remote symbols
        run: |
          cmake --build "${BUILD_DIR}" --target MobileGL --parallel "$(nproc)"
          python3 scripts/ci/runtime_mode_proof.py build --build-dir "${BUILD_DIR}" \
            --mode monolith --output "${BUILD_DIR}/runtime-mode.json"
      - name: Prepare packaged test metadata
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package push control
        run: |
          tar -czf mobilegl-linux-monolith-control.tgz \
            "${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/libMobileGL.so" "${BUILD_DIR}/runtime-mode.json"
      - name: Upload push control
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-monolith-control
          path: mobilegl-linux-monolith-control.tgz
          if-no-files-found: error

  test:
    runs-on: ubuntu-26.04
    needs: [build-linux]

    # Every ctest entry is its own short-lived process, and none compiles enough to repay
    # Initialize()'s glslang table prewarm. The retrace legs keep it: they replay real apps.
    env:
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libgles2 libgl1-mesa-dri mesa-vulkan-drivers ${{ env.MOBILEGL_CI_DISAGGREGATED == 'ON' && 'libegl-mesa0' || '' }}

      - name: Download Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-runtime
          path: .

      - name: Unpack Linux runtime
        run: tar --zstd -xf mobilegl-linux-runtime.tar.zst

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      # On the three branches this is also the split runtime's unit run (integration-split skips
      # its copy when build-linux-split reuses this build), so it keeps that run's hardening:
      # REQUIRE_GPU makes the server loop's EGL cases fail rather than skip without a driver.
      - name: Test
        working-directory: build-linux
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: ${{ env.MOBILEGL_CI_DISAGGREGATED == 'ON' && '1' || '' }}
        run: |
          ulimit -c unlimited
          if [ "${{ secrets.ACTIONS_STEP_DEBUG }}" = "true" ]; then
            ctest -V -L unit --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/unit.xml"
          else
            ctest --output-on-failure -L unit --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/unit.xml"
          fi

      - name: Disk and cores after the unit run
        if: ${{ always() }}
        run: |
          df -h / /tmp
          echo "cores: $(ls /tmp/core.* 2> /dev/null | wc -l), $(du -ch /tmp/core.* 2> /dev/null | tail -n 1)"

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-core-dumps
          path: /tmp/core.*
          if-no-files-found: ignore

  integration:
    name: integration (${{ matrix.transport }})
    runs-on: ubuntu-26.04
    needs: [build-linux]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && '[{"lane":"monolith-control","transport":"monolith"},{"lane":"inproc-acceptance","transport":"inproc"}]' || '[{"lane":"monolith-control","transport":"monolith"}]') }}
    env:
      # Short-lived test processes skip the glslang prewarm, as in the test job.
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"
      MOBILEGL_TRANSPORT: ${{ matrix.transport }}
      MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
      MOBILEGL_IPC_STRICT_ERRORS: "1"
      MOBILEGL_IPC_RUN_AHEAD: "1"
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        # Same set as the benchmark job, for the same reason: the scenarios bring
        # up real headless EGL (llvmpipe) and Vulkan (lavapipe) contexts, and
        # libegl-mesa0 - the EGL vendor library behind glvnd's libegl1 dispatch -
        # only arrives as a Recommends.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Download Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-runtime
          path: .

      - name: Unpack Linux runtime
        run: tar --zstd -xf mobilegl-linux-runtime.tar.zst

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Integration scenarios
        working-directory: build-linux
        # REQUIRE_GPU makes a driverless runner FAIL instead of skipping every
        # scenario - an all-skip run is otherwise indistinguishable from a pass,
        # which is how a five-month-old draw-dropping bug survived unseen until
        # this lane existed.
        #
        # Configure CMake with the selected runner's ICD; each test's ENVIRONMENT
        # property takes precedence over ambient job variables.
        #
        # Cores are armed so that any crash - the harness pre-flight child's
        # included - leaves /tmp/core.*.zst, which the failure-only step below ships
        # as an artifact. Analyzing a downloaded core (zstd -d) against the runtime
        # artifact's binary in an ubuntu-26.04 userspace reproduces the exact
        # crash stack without burning a CI round on an in-workflow debugger.
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_ITRP_FIX: "ForceOn"
        run: |
          ulimit -c unlimited
          # An entry whose own ENVIRONMENT sets MOBILEGL_TRANSPORT overrides the one variable the two
          # legs differ in, so it runs identically in both; the inproc leg leaves those entries (and
          # the fixtures only they need) to the monolith-control leg, which every branch runs.
          # transport_pinned.py proves the trimmed selection lost exactly them, or this leg runs
          # them all as before; the monolith-control leg proves it ran every one of them.
          ctest -L integration-gpu --show-only=json-v1 > "${RUNNER_TEMP}/all.json"
          EXCLUDE=()
          if [ "${MOBILEGL_TRANSPORT}" = inproc ]; then
            if python3 ../scripts/ci/transport_pinned.py select "${RUNNER_TEMP}/all.json" --out "${RUNNER_TEMP}/transport-pinned.txt" \
               && ctest -L integration-gpu --exclude-from-file "${RUNNER_TEMP}/transport-pinned.txt" --show-only=json-v1 \
                    > "${RUNNER_TEMP}/trimmed.json" \
               && python3 ../scripts/ci/transport_pinned.py assert-exclusion "${RUNNER_TEMP}/all.json" \
                    "${RUNNER_TEMP}/trimmed.json" --out "${RUNNER_TEMP}/transport-pinned.json"; then
              EXCLUDE=(--exclude-from-file "${RUNNER_TEMP}/transport-pinned.txt")
            else
              echo "::warning::the transport-pinned exclusion did not prove itself, so this leg runs every integration-gpu entry"
            fi
          fi
          # Second, filtered pass: with the range-invalidating map flush disabled,
          # the buffer scenarios run on the upload ring's staged-copy tier - which
          # the default pass never reaches (the map tier absorbs every flush on
          # the CI drivers), so without this the Mali fallback tier would have zero CI
          # coverage. The flag is NOT baked into the ctest ENVIRONMENT properties,
          # so an inline env reaches the test processes (unlike the ICD pin above).
          if [ "${{ secrets.ACTIONS_STEP_DEBUG }}" = "true" ]; then
            ctest -V -L integration-gpu "${EXCLUDE[@]}" --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/integration.xml"
            MOBILEGL_ESPRYT_DISABLE_INVALIDATE_FLUSH=1 ctest -V -L integration-gpu "${EXCLUDE[@]}" -j "$(nproc)" \
              -R 'Buffer|Readback|Atomic|Ssbo|Arena' --no-tests=error --output-junit "${RUNNER_TEMP}/integration-staged-copy.xml"
          else
            ctest --output-on-failure -L integration-gpu "${EXCLUDE[@]}" --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/integration.xml"
            MOBILEGL_ESPRYT_DISABLE_INVALIDATE_FLUSH=1 ctest --output-on-failure -L integration-gpu "${EXCLUDE[@]}" -j "$(nproc)" \
              -R 'Buffer|Readback|Atomic|Ssbo|Arena' --no-tests=error --output-junit "${RUNNER_TEMP}/integration-staged-copy.xml"
          fi
          if [ "${MOBILEGL_TRANSPORT}" = monolith ] && [ "${MOBILEGL_CI_DISAGGREGATED}" = ON ]; then
            python3 ../scripts/ci/transport_pinned.py require-ran "${RUNNER_TEMP}/all.json" "${RUNNER_TEMP}/integration.xml"
          fi

      # Both backend roles must execute inproc in the primary artifact.
      - name: Inproc execution proof (both backends)
        if: matrix.transport == 'inproc'
        working-directory: build-linux
        run: |
          ctest -L integration-p5f-rsp --show-only=json-v1 > "${RUNNER_TEMP}/primary-inproc-lane.json"
          ctest -L integration-p5f-rsp --no-tests=error --output-on-failure \
            --output-junit "${RUNNER_TEMP}/primary-inproc.xml"
          python3 ../scripts/ci/runtime_mode_proof.py logs \
            --discovery "${RUNNER_TEMP}/primary-inproc-lane.json" \
            --junit "${RUNNER_TEMP}/primary-inproc.xml" --output "${RUNNER_TEMP}/primary-inproc-proof.json"

      # The run log needs a signed-in reader; annotations do not. Name every failed ctest entry,
      # with the lines of its output that say why, where anyone reading the run can see them.
      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py "${RUNNER_TEMP}"

      - name: Upload integration lane evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-evidence-${{ matrix.lane }}-${{ matrix.transport }}
          path: |
            ${{ runner.temp }}/integration*.xml
            ${{ runner.temp }}/primary-inproc*
            ${{ runner.temp }}/transport-pinned*
            ${{ runner.temp }}/all.json
            ${{ runner.temp }}/trimmed.json
            build-linux/runtime-mode.json
            build-linux/MobileGL/MG_IntegrationTest/p5f-rsp-*.log
          if-no-files-found: warn

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-${{ matrix.lane }}-${{ matrix.transport }}
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-core-dumps-${{ matrix.lane }}-${{ matrix.transport }}
          path: /tmp/core.*
          if-no-files-found: ignore

  # THE THIRD CI MODE (ARCHITECTURE.md 13.2-(2)): the same library, built with the PipeInputs
  # comparator compiled in, running the integration suite and a trace subset with two state models
  # in one address space. It is a second build rather than a flag on the first because
  # MOBILEGL_PIPE_VERIFY is a compile-time option - the snapshot, the entry compare and the
  # compare-at-read hook do not exist in the shipped library, and are never meant to.
  build-linux-verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      BUILD_DIR: build-verify
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-

      - name: Prepare Vulkan SDK
        id: netsetup530
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup530.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Install build dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build

      - name: Show installed toolchain
        run: |
          ccache --version
          "${MOBILEGL_CI_CC}" --version
          "${MOBILEGL_CI_CXX}" --version
          "${MOBILEGL_CI_LLD}" --version
          dpkg -l 'libc++*' 'libegl*' 'libgles*' 'mesa*' 'vulkan*' || true

      - name: Configure CMake
        # Release/INFO like the shipped build on purpose. The poison arms in this configuration
        # through MOBILEGL_PIPE_VERIFY (PipeInputs.h derives MOBILEGL_PIPE_POISON from it), so this
        # job needs neither a Debug log level nor MOBILEGL_BUILD_DISAGGREGATED - and a Debug build
        # would compare a different library from the one the other lanes measure. (build-linux
        # switches to Debug under ACTIONS_STEP_DEBUG; this job deliberately does not - a Debug
        # build flips CXX_VISIBILITY_PRESET and arms MOBILEGL_PIPE_POISON through a second, unrelated
        # arm of its #if, so the debug switch would change what the lane is measuring.)
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_C_COMPILER="${MOBILEGL_CI_CC}" \
            -DCMAKE_CXX_COMPILER="${MOBILEGL_CI_CXX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOBILEGL_LOG_ACTIVE_LEVEL=MOBILEGL_LOG_LEVEL_INFO \
            -DMOBILEGL_BUILD_TEST=ON \
            -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DMOBILEGL_BUILD_INTEGRATION_TEST=ON \
            -DMOBILEGL_ITEST_VK_ICD="${VK_ICD_FILENAMES}" \
            -DMOBILEGL_BUILD_TRACE_REPLAY=OFF \
            -DMOBILEGL_PIPE_VERIFY=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)"

      # The lane is worthless if the option silently did not take, and that is a one-character
      # mistake away at all times (a typo'd -D is not an error in CMake). Two checks, both cheap:
      # the comparator's entry point must be in the library, and the fill entry point with it.
      #
      # `nm` and NOT `nm -D`. The library is built CXX_VISIBILITY_PRESET hidden in every non-Debug
      # configuration (CMakeLists.txt:600-604) and the MGPipe entry points are plain namespace
      # functions with no export attribute, so not one of them appears in the DYNAMIC table: on a
      # perfectly healthy verify build `nm -D --defined-only ... | grep -c MGPipe` answers 0 out of
      # ~11900 exported symbols, and a gate spelled that way is red forever for a reason that has
      # nothing to do with what it claims to test. The static symbol table has them as local `t`
      # entries, this artifact is never stripped, and `No MG_Remote in the pull build` below already
      # uses this spelling. The symbol count guards the remaining hole: a stripped library would
      # make both greps fail for a third, silent reason.
      - name: Comparator symbols in verify library
        run: |
          test -f "${BUILD_DIR}/libMobileGL.so"
          defined=$(nm --defined-only "${BUILD_DIR}/libMobileGL.so" | wc -l)
          if [ "${defined}" -lt 1000 ]; then
            echo "::error::nm --defined-only sees only ${defined} symbols in ${BUILD_DIR}/libMobileGL.so - it looks stripped, so the two checks below could not have failed honestly"
            exit 1
          fi
          if ! nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -q "MGPipeVerifyInputs"; then
            echo "::error::libMobileGL.so defines no MGPipeVerifyInputs: -DMOBILEGL_PIPE_VERIFY=ON did not take, and every lane that consumes this artifact would run the comparator-free library and pass having compared nothing"
            exit 1
          fi
          # The per-verb entry point, under EITHER of its two names. P2 renames
          # MGPipeFillForVerb to MGPipeValidateForVerb (the body becomes the tracker's walk and
          # the fill is one of its five steps), so this check has to accept both or it goes red on
          # the rename for a reason that has nothing to do with what it tests. What it tests is
          # unchanged: that the library HAS a per-verb entry point compiled in.
          if ! nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -qE "MGPipeValidateForVerb|MGPipeFillForVerb"; then
            echo "::error::libMobileGL.so defines neither MGPipeValidateForVerb nor MGPipeFillForVerb: there is no per-verb entry point in this artifact, so nothing fills the block the comparator compares"
            exit 1
          fi
          echo "libMobileGL.so defines MGPipeVerifyInputs and a per-verb entry point (${defined} defined symbols)"

      - name: Show ccache stats
        if: ${{ always() }}
        run: ccache --show-stats

      - name: Release superseded ccache entry
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" --ref "${GITHUB_REF}" || true

      - name: Save ccache
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1

      - name: Prepare packaged test metadata
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package Linux verify runtime
        run: |
          mkdir -p ci-artifacts
          mapfile -t SHARED_LIBS < <(find "${BUILD_DIR}" -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          tar \
            --exclude='*/CMakeFiles' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ninja*' \
            --exclude='build.ninja' \
            --exclude='cmake_install.cmake' \
            --zstd -cf ci-artifacts/mobilegl-linux-runtime-verify.tar.zst \
            "${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/CTestTestfile.cmake" \
            "${BUILD_DIR}/MobileGL/MG_Test" \
            "${BUILD_DIR}/MobileGL/MG_IntegrationTest" \
            "${SHARED_LIBS[@]}"

      - name: Upload Linux verify runtime
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-runtime-verify
          path: ci-artifacts/mobilegl-linux-runtime-verify.tar.zst
          if-no-files-found: error

      # The retrace legs load only the library, and the server image on the spawn arm, so they
      # take this instead of the whole test runtime.
      - name: Package retrace library
        run: |
          files=("${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/libMobileGL.so")
          if [ -f "${BUILD_DIR}/libMobileGLServer.so" ]; then files+=("${BUILD_DIR}/libMobileGLServer.so"); fi
          tar -czf ci-artifacts/mobilegl-linux-lib-verify.tgz "${files[@]}"

      - name: Upload retrace library
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-lib-verify
          path: ci-artifacts/mobilegl-linux-lib-verify.tgz
          if-no-files-found: error

  # The verify lane itself, plus the controls that keep it falsifiable: its own control entries,
  # checked by name, and the two corrupted-snapshot steps. They are always on, not a manual
  # exercise: a gate that can only be shown to work by someone remembering to break it on purpose
  # is a gate that has already stopped working.
  integration-verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    needs: [build-linux-verify]

    # Short-lived test processes skip the glslang prewarm, as in the test job.
    env:
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Download Linux verify runtime
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-runtime-verify
          path: .

      - name: Unpack Linux verify runtime
        run: |
          tar --zstd -xf mobilegl-linux-runtime-verify.tar.zst
          test -f build-verify/libMobileGL.so

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Integration scenarios (verify)
        working-directory: build-verify
        # --no-tests=error is half the gate: the verify entries only exist when the library was
        # configured with -DMOBILEGL_PIPE_VERIFY=ON, so a build that lost the option matches no
        # tests and reds here instead of reporting a green run of nothing. The other half is
        # PipeVerifyArmingScenario.Armed, which fails when the library never printed its arming
        # line - the failure mode a bare `MOBILEGL_PIPE_VERIFY=1` cannot detect by itself.
        #
        # SCOPE, stated so nobody reads more into a green than is there: this is every integration
        # ENTRY under the comparator, not every integration CONFIGURATION. The `integration` job
        # runs a second, filtered pass with MOBILEGL_ESPRYT_DISABLE_INVALIDATE_FLUSH=1 for the
        # upload ring's staged-copy tier; that pass is 186 entries here and, at the 5-10x the
        # comparator costs, is not affordable inside this job's budget. The tier is covered by
        # `integration`, unverified, and P2 can take it once the comparator's cost is known.
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_ITRP_FIX: "ForceOn"
        run: |
          ulimit -c unlimited
          if [ "${{ secrets.ACTIONS_STEP_DEBUG }}" = "true" ]; then
            ctest -V -L integration-verify --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/verify.xml"
          else
            ctest --output-on-failure -L integration-verify --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/verify.xml"
          fi

      # The unit suite again, on the verify library: cases compiled only under MOBILEGL_PIPE_VERIFY
      # skip in the `test` job's build and assert only here, as do poison-gated cases on branches
      # where that build is a monolith. The packaging step above ships MG_Test whole, so the cost
      # is the run itself. --no-tests=error, so a packaging change that dropped the unit binaries
      # fails here instead of passing with nothing run.
      - name: Unit tests on the verify runtime (G6, G10)
        working-directory: build-verify
        run: ctest --output-on-failure -L unit --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/unit-verify.xml"

      # Handle-ABA, CSO, subsystem-mask and texture-parameter controls, rerun on the verify library.
      # They carry integration-gpu, not integration-verify, so the verify lane misses them.
      # Each -R alternative is a test-name substring, the shortest that selects only its family:
      # `ResourceSubsystem` also reaches the LargeArenaAdoption lanes and the mask refusals,
      # `MapPersistentRoundtrip` is singular so it matches the case name as well as the lane prefix,
      # and `ObjectSubsystem` and `ResourceSubsystem` stay distinct families. TextureUploadShape
      # records the upload shape; it fails only when its two counters are unreadable or disagree.
      - name: Push-build controls (G8, G8b, G9, G10, G12)
        working-directory: build-verify
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_ITRP_FIX: "ForceOn"
        run: |
          ulimit -c unlimited
          ctest --output-on-failure -L integration-gpu \
            -R 'HandleRecycle|CsoContentAddressing|ResourceSubsystem|MapPersistentRoundtrip|ObjectSubsystem|TextureParamsWithoutASamplerView|TextureUploadShape' \
            --no-tests=error -j 4

      # The lane's own control entries, by name: each must have run and passed, and a skip is a
      # failure here although ctest reports it green. VerifyArming asserts in-test that the
      # comparator printed its armed line, VerifyCorrupted that a corrupted field is reported by
      # name, and PoisonOmitted that an omitted stamp kills a forked child with its own Fatal.
      - name: Verify lane control entries
        run: |
          python3 scripts/ci/junit_tally.py "${RUNNER_TEMP}/verify.xml" \
            --require-entry-passed DirectGLES.VerifyArming.PipeVerifyArmingScenario.Armed \
            --require-entry-passed DirectVulkan.VerifyArming.PipeVerifyArmingScenario.Armed \
            --require-entry-passed DirectGLES.VerifyCorrupted.PipeVerifyArmingScenario.CorruptedFieldIsReported \
            --require-entry-passed DirectVulkan.VerifyCorrupted.PipeVerifyArmingScenario.CorruptedFieldIsReported \
            --require-entry-passed DirectGLES.PoisonOmitted.PoisonOmissionScenario.OmittedFieldAbortsOnThatVerb \
            --require-entry-passed DirectVulkan.PoisonOmitted.PoisonOmissionScenario.OmittedFieldAbortsOnThatVerb

      # NEGATIVE CONTROL A (gate G4). The knob perturbs one field in the snapshot arm before the
      # entry compare, so a working comparator must abort the run. This step passes when ctest
      # FAILS - `if ctest ...; then error` - which is the only shape that can catch a comparator
      # that silently compares nothing.
      #
      # The knob reaches the test process through the JOB environment: no ctest ENVIRONMENT
      # property on the ambient Verify. entries names it (MG_IntegrationTest/CMakeLists.txt says
      # so out loud), and a property entry would otherwise override this and the control would
      # prove nothing. Same precedent as MOBILEGL_ESPRYT_DISABLE_INVALIDATE_FLUSH in `integration`.
      - name: Negative control A (corrupted snapshot)
        working-directory: build-verify
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_PIPE_VERIFY_CORRUPT: GetRenderStateParameters
        run: |
          FILTER='DirectGLES\.Verify\..*ClearThenReadPixels'
          # An empty selection would ALSO make ctest exit non-zero (--no-tests=error), and this
          # step reads non-zero as "the control worked" - so the selection is counted first. A
          # control that passes because it ran nothing is worse than no control.
          matched=$(ctest -N -L integration-verify -R "${FILTER}" | grep -cE '^ *Test *#[0-9]+:')
          if [ "${matched}" -lt 1 ]; then
            echo "::error::negative control A selected ${matched} tests; its filter no longer matches anything"
            exit 1
          fi
          if ctest --output-on-failure -L integration-verify -R "${FILTER}" --no-tests=error; then
            echo "::error::MOBILEGL_PIPE_VERIFY_CORRUPT=GetRenderStateParameters left ${matched} verify entries GREEN. The comparator is not comparing, so every green entry above is green for no reason."
            exit 1
          fi
          echo "the corrupted field turned ${matched} selected entries red, as it must"

      # NEGATIVE CONTROL A2 (P13 W3c): THE CAPABILITY CROSS-CHECK MOVED HERE. ResidualValueBlock
      # carried the 35 capability bits redundantly so the applier could trip on a capability no
      # record carried; P13 deleted it, and the intent is the comparator's now. So a corrupted
      # capability field must turn the same selection red, or the block's deletion lost its
      # check rather than moving it.
      - name: Negative control A2 (corrupted capability)
        working-directory: build-verify
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_PIPE_VERIFY_CORRUPT: IsCapabilityEnabled
        run: |
          FILTER='DirectGLES\.Verify\..*ClearThenReadPixels'
          matched=$(ctest -N -L integration-verify -R "${FILTER}" | grep -cE '^ *Test *#[0-9]+:')
          if [ "${matched}" -lt 1 ]; then
            echo "::error::negative control A2 selected ${matched} tests; its filter no longer matches anything"
            exit 1
          fi
          if ctest --output-on-failure -L integration-verify -R "${FILTER}" --no-tests=error; then
            echo "::error::MOBILEGL_PIPE_VERIFY_CORRUPT=IsCapabilityEnabled left ${matched} verify entries GREEN. The comparator does not compare the capability field, so deleting the residual block (P13 W3c) lost the check it carried."
            exit 1
          fi
          echo "the corrupted capability field turned ${matched} selected entries red, as it must"

      - name: Upload verify lane logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-verify-logs
          path: build-verify/MobileGL/MG_IntegrationTest/pipe-*.log*
          if-no-files-found: warn

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-verify
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-verify-core-dumps
          path: /tmp/core.*
          if-no-files-found: ignore

  # The comparator on the split (inproc) arm, both backends, with its control entries checked by
  # name and the corrupted-snapshot control red on that arm.
  #
  # ITS OWN BUILD, because neither existing one can carry it: build-linux-verify configures
  # without MOBILEGL_BUILD_DISAGGREGATED (so MG_Remote and the transport parser do not exist and
  # `MOBILEGL_TRANSPORT=inproc` would be accepted and ignored), and build-linux-split configures
  # without MOBILEGL_PIPE_VERIFY (so the comparator does not exist). The integration-verify-split
  # entries are registered only when BOTH options are on, so `--no-tests=error` below reds a build
  # that lost either one instead of reporting a green run of nothing. Built and run in one job:
  # nothing downstream consumes this library.
  #
  # INPROC ONLY, BY THE INSTRUMENT'S NATURE: the comparator's two arms (the applier-written
  # gPipeInputs and the frontend GLContext) are co-resident only when both roles share a process.
  # MG_IntegrationTest/CMakeLists.txt's verify-split block records the spawn measurement.
  integration-verify-split:
    runs-on: ubuntu-26.04
    needs: [build-linux-verify-split]
    timeout-minutes: 180

    # Short-lived test processes skip the glslang prewarm, as in the test job.
    env:
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"
      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10
      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - name: Download verify-split runtime
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-runtime-verify-split
          path: .
      - name: Unpack verify-split runtime
        run: tar --zstd -xf mobilegl-linux-runtime-verify-split.tar.zst

      # The lane. `^...$` because ctest -L is a regex (ID-131) and `integration-verify` would
      # otherwise also match this label and the monolith one would match both.
      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Verify-split scenarios (inproc)
        working-directory: build-verify-split
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
        run: |
          ulimit -c unlimited
          # --output-junit, because the arm proof below has to tell a gtest SKIP from a pass: an
          # entry that skipped reached no verb honestly, and the skip set moves with the driver.
          ctest --output-on-failure -L '^integration-verify-split$' --no-tests=error -j 4 \
            --output-junit "${RUNNER_TEMP}/verify-split.xml"

      # THE ARM PROOF, PER ENTRY AND BY NAME. Every ambient entry has a private log path
      # (SplitLogPaths.cmake.in), so this - unlike integration-verify's grep over a shared log -
      # is a census:
      #   * ConfigLoader's `MOBILEGL_TRANSPORT=inproc` line in EVERY client log: an entry that ran
      #     monolith would have passed every assertion above and fails here by name;
      #   * `MGPipe: verify armed` in both VerifySplitArming. logs;
      #   * and then the census proper. This used to be a FLOOR - "at least 850 armed of at least
      #     1000 logs" - which leaves the remaining ~155 unnamed, so the lane could lose fifty
      #     arms, gain fifty skips, and the floor would not move. It is now the two-sided rule
      #     dualblock-expected-fatals.txt already rides: each client log must ARM, or belong to an
      #     entry ctest reported SKIPPED, or be NAMED in Harness/verify-split-unarmed-expected.txt
      #     (56 names in five classes, each class saying why it reaches no verb). A listed entry
      #     that arms, and a listed name with no log at all, both fail - an exception set that
      #     keeps rows nothing needs is how a proof rots green.
      - name: Verify-split per-entry arm proof
        working-directory: build-verify-split/MobileGL/MG_IntegrationTest
        run: |
          shopt -s nullglob
          logs=(verify-split-logs/*.client.log)
          if [ ${#logs[@]} -lt 1000 ]; then
            echo "::error::found ${#logs[@]} per-entry client logs under verify-split-logs (expected ~1064): the private log paths did not take, so nothing below is a per-entry proof"
            exit 1
          fi
          missing=$(grep -L 'Config: MOBILEGL_TRANSPORT=inproc' "${logs[@]}" | wc -l)
          if [ "${missing}" -ne 0 ]; then
            grep -L 'Config: MOBILEGL_TRANSPORT=inproc' "${logs[@]}" | head -20
            echo "::error::${missing} verify-split entries carry no resolved MOBILEGL_TRANSPORT=inproc line: they did not run on the split arm"
            exit 1
          fi
          for backend in DirectGLES DirectVulkan; do
            if ! grep -q "MGPipe: verify armed" "pipe-verify-split-arming-${backend}.client.log"; then
              echo "::error::pipe-verify-split-arming-${backend}.client.log carries no arming line"
              exit 1
            fi
          done
          python3 "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            verify-split-arming verify-split-logs "${RUNNER_TEMP}/verify-split.xml" \
            "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/verify-split-unarmed-expected.txt"

      # The lane's own control entries, by name, as in integration-verify: VerifySplitReadCorrupted
      # asserts in-test the two where=read reports in the server half, and VerifySplitPoisonOmitted
      # reads both role halves of the forked child's log for its own Fatal.
      - name: Verify-split control entries
        run: |
          args=()
          for backend in DirectGLES DirectVulkan; do
            args+=(--require-entry-passed "${backend}.VerifySplitArming.PipeVerifyArmingScenario.Armed")
            args+=(--require-entry-passed "${backend}.VerifySplitCorrupted.PipeVerifyArmingScenario.CorruptedFieldIsReported")
            args+=(--require-entry-passed "${backend}.VerifySplitReadCorrupted.PipeVerifyArmingScenario.CorruptedFieldIsReportedOnTheServerRead")
            args+=(--require-entry-passed "${backend}.VerifySplitPoisonOmitted.PoisonOmissionScenario.OmittedFieldAbortsOnThatVerb")
          done
          python3 scripts/ci/junit_tally.py "${RUNNER_TEMP}/verify-split.xml" "${args[@]}"

      # THE GREEN LANE'S LOGS, KEPT BEFORE THE CONTROLS OVERWRITE THEM. The control step below
      # re-runs ambient VerifySplit. entries with a knob exported, and an ambient entry writes to
      # ITS OWN per-entry path under verify-split-logs/ - which the library opens "w". So by the
      # time the upload step at the end of this job runs, the selected files are the CONTROL
      # runs' logs sitting under the LANE's names: an artifact showing deliberate divergences,
      # with the green run they were meant to be evidence of already gone. `if: always()` on the
      # upload made that worse rather than better, because a failure investigation is exactly
      # when the overwritten half is the half somebody needs.
      - name: Keep lane logs before controls
        if: ${{ always() }}
        working-directory: build-verify-split/MobileGL/MG_IntegrationTest
        run: |
          rm -rf verify-split-logs-lane
          cp -a verify-split-logs verify-split-logs-lane
          cp -p "${RUNNER_TEMP}/verify-split.xml" verify-split-logs-lane/ || true
          echo "kept $(ls verify-split-logs-lane | wc -l) file(s) from the green lane run"

      # NEGATIVE CONTROL A ON THE SPLIT ARM - integration-verify's step A, same knob, same shape
      # (this step passes when ctest FAILS), aimed at the ambient VerifySplit. entries of BOTH
      # backends. Measured at landing: 10 of 10 red, each with
      # Fatal{PipeVerifyDiffer, "GetRenderStateParameters@Clear"|"@DrawArrays", ..., where=entry}.
      - name: Negative control A (corrupted snapshot)
        working-directory: build-verify-split
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_PIPE_VERIFY_CORRUPT: GetRenderStateParameters
        run: |
          FILTER='(DirectGLES|DirectVulkan)\.VerifySplit\..*ClearThenReadPixels'
          matched=$(ctest -N -L '^integration-verify-split$' -R "${FILTER}" | grep -cE '^ *Test *#[0-9]+:')
          if [ "${matched}" -lt 2 ]; then
            echo "::error::split negative control A selected ${matched} tests; its filter no longer matches both backends"
            exit 1
          fi
          if ctest --output-on-failure -L '^integration-verify-split$' -R "${FILTER}" --no-tests=error; then
            echo "::error::MOBILEGL_PIPE_VERIFY_CORRUPT=GetRenderStateParameters left ${matched} verify-split entries GREEN. The comparator is not comparing on the split arm."
            exit 1
          fi
          echo "the corrupted field turned ${matched} selected split entries red, as it must"

      # BOTH SETS, AND THEY ARE DIFFERENT EVIDENCE. verify-split-logs-lane/ is the green run the
      # arm proof read; verify-split-logs/ is whatever the control step left behind, which for
      # its entries is a deliberately red re-run under the same name. Uploading only the
      # second - which is what this step did before the copy above existed - loses the first.
      # The run log needs a signed-in reader; annotations do not. Name every failed ctest entry,
      # with the lines of its output that say why, where anyone reading the run can see them.
      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py "${RUNNER_TEMP}"

      - name: Upload verify-split lane logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-verify-split-logs
          path: |
            build-verify-split/MobileGL/MG_IntegrationTest/verify-split-logs-lane/**
            build-verify-split/MobileGL/MG_IntegrationTest/verify-split-logs/**
            build-verify-split/MobileGL/MG_IntegrationTest/pipe-*split*.log*
          if-no-files-found: warn

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-verify-split
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-verify-split-core-dumps
          path: /tmp/core.*
          if-no-files-found: ignore

  # The split build: the same sources with the transport and its in-process arm always on, which the
  # split integration and retrace lanes consume. On the disaggregation branches build-linux has the
  # same configuration apart from the benchmarks; the guard below proves that on this runner, and
  # when it holds this job skips its compile and the consumers take build-linux's artifacts
  # (build-linux runs the same guard, and the consumers require both). On dev it builds as before.
  #
  # The `nm` step is the point of a build of its own. In a build without the option, MG_Remote is
  # not compiled and MOBILEGL_TRANSPORT's parser does not exist, so the variable is accepted and
  # ignored and every downstream lane would run monolith under a name that says split. CMake does
  # not complain about a typo'd -D, so the build-level assertion is the guard; in reuse mode
  # build-linux's runtime_mode_proof (--mode disaggregated) is the same assertion and more.
  build-linux-split:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    outputs:
      reuse-primary: ${{ steps.guard.outputs.identical == 'true' && 'true' || 'false' }}
    env:
      BUILD_DIR: build-split
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # recursive, and load-bearing here beyond the usual: MOBILEGL_BUILD_DISAGGREGATED
          # shadows itself back to OFF when 3rdparty/flatbuffers/include is missing (a normal
          # variable rather than a cache force, deliberately). A shallow checkout would therefore
          # configure cleanly, build a monolith library, and be caught only by the nm step below.
          submodules: recursive

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Prepare Vulkan SDK
        id: netsetup1274
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup1274.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Install build dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build

      - name: Show installed toolchain
        run: |
          ccache --version
          "${MOBILEGL_CI_CC}" --version
          "${MOBILEGL_CI_CXX}" --version
          dpkg -l 'libc++*' 'libegl*' 'libgles*' 'mesa*' 'vulkan*' || true

      # Release/INFO like the shipped build; the line and the reasons are in
      # scripts/ci/configure_build.sh, shared with build-linux.
      - name: Configure CMake
        run: bash scripts/ci/configure_build.sh split "${BUILD_DIR}"

      # build-linux's configuration, probed on this runner and compared with this tree. Equal
      # means this job builds nothing and ends green; the consumers then take build-linux's
      # artifacts, and red if build-linux's own guard disagrees. It never reds this job.
      - name: Primary configuration guard
        id: guard
        if: env.MOBILEGL_CI_DISAGGREGATED == 'ON'
        env:
          CI_BUILD_TYPE: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' && 'Debug' || 'Release' }}
        run: |
          if python3 scripts/ci/build_fingerprint.py --self-test > "${RUNNER_TEMP}/fingerprint-self-test.txt"; then
            python3 scripts/ci/build_fingerprint.py guard --built "${BUILD_DIR}" --probe primary \
              --probe-dir build-guard-primary --github-output identical || echo "identical=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/fingerprint-self-test.txt"
            echo "::warning::build_fingerprint.py's self-test failed, so this job builds its own library"
            echo "identical=false" >> "${GITHUB_OUTPUT}"
          fi
          rm -rf build-guard-primary

      - name: Set swap space
        if: steps.guard.outputs.identical != 'true'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Restore ccache
        if: steps.guard.outputs.identical != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-

      - name: Build
        if: steps.guard.outputs.identical != 'true'
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)"

      # `nm` and NOT `nm -D`, for the reason build-linux-verify spells out: everything under
      # MG_Remote is a plain namespace symbol in a CXX_VISIBILITY_PRESET=hidden Release build and
      # none of it reaches the dynamic table. The symbol count guards the remaining hole - a
      # stripped library would make the grep fail for a third, silent reason.
      #
      - name: MG_Remote symbols in split library
        if: steps.guard.outputs.identical != 'true'
        run: |
          test -f "${BUILD_DIR}/libMobileGL.so"
          defined=$(nm --defined-only "${BUILD_DIR}/libMobileGL.so" | wc -l)
          if [ "${defined}" -lt 1000 ]; then
            echo "::error::nm --defined-only sees only ${defined} symbols in ${BUILD_DIR}/libMobileGL.so - it looks stripped, so the checks below could not have failed honestly"
            exit 1
          fi
          remote=$(nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -c -i "MG_Remote" || true)
          if [ "${remote}" -lt 1 ]; then
            echo "::error::libMobileGL.so defines no MG_Remote symbol: -DMOBILEGL_BUILD_DISAGGREGATED=ON did not take (a typo'd -D is not a CMake error, and the option shadows itself OFF when 3rdparty/flatbuffers/include is missing). Every lane that consumes this artifact would run MONOLITH while claiming to run split, because the MOBILEGL_TRANSPORT parser does not exist in such a build and the variable is accepted and ignored."
            exit 1
          fi
          # The transport parser itself, which is the symbol the runtime evidence depends on.
          if ! nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -q "MGPipeApply"; then
            echo "::error::libMobileGL.so defines no MGPipeApply* entry point, so MOBILEGL_PIPE_PUSH did not take either and there is no applier for the split path to decode into"
            exit 1
          fi
          echo "libMobileGL.so defines ${remote} MG_Remote symbol(s) and the MGPipe applier (${defined} defined symbols)"

      # Server link-closure ratchet (ARCHITECTURE.md §13.2): scripts/link_ratchet.py recomputes
      # from the per-object partition the frontend symbols a server-only image still has to link
      # and compares the list with the stored baseline. Only new symbols fail; a vanished one is
      # printed with a request to re-baseline in the same commit. The baseline is a list, not a
      # count, so swapping one symbol for another fails. It runs where MG_Remote is built (the
      # script re-checks CMakeCache.txt) and before anything deletes the *.o files it reads: here,
      # or in build-linux when this job reuses that build.
      - name: Server link-closure ratchet
        if: steps.guard.outputs.identical != 'true'
        run: |
          mkdir -p ci-artifacts
          python3 scripts/link_ratchet.py --self-test
          python3 scripts/link_ratchet.py \
            --build-dir "${BUILD_DIR}" \
            --baseline scripts/data/link_ratchet_baseline.txt \
            --assert-monotone \
            --bucket \
            --json ci-artifacts/link-ratchet.json

      # Uploaded even when the gate fired: a red ratchet is exactly the moment someone needs the
      # per-symbol definer/referrer attribution the JSON carries.
      - name: Upload link ratchet
        if: ${{ always() && steps.guard.outputs.identical != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: link-ratchet
          path: ci-artifacts/link-ratchet.json
          if-no-files-found: warn
          overwrite: true

      - name: Show ccache stats
        if: ${{ always() && steps.guard.outputs.identical != 'true' }}
        run: ccache --show-stats

      # Only after a build: with nothing built, deleting would drop this branch's entry for good.
      - name: Release superseded ccache entry
        if: steps.guard.outputs.identical != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" --ref "${GITHUB_REF}" || true

      - name: Save ccache
        if: steps.guard.outputs.identical != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1

      - name: Prepare packaged test metadata
        if: steps.guard.outputs.identical != 'true'
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package Linux split runtime
        if: steps.guard.outputs.identical != 'true'
        run: |
          mkdir -p ci-artifacts
          mapfile -t SHARED_LIBS < <(find "${BUILD_DIR}" -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          tar \
            --exclude='*/CMakeFiles' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.ninja*' \
            --exclude='build.ninja' \
            --exclude='cmake_install.cmake' \
            --zstd -cf ci-artifacts/mobilegl-linux-runtime-split.tar.zst \
            "${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/CTestTestfile.cmake" \
            "${BUILD_DIR}/MobileGL/MG_Test" \
            "${BUILD_DIR}/MobileGL/MG_IntegrationTest" \
            "${SHARED_LIBS[@]}"

      - name: Upload Linux split runtime
        if: steps.guard.outputs.identical != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-runtime-split
          path: ci-artifacts/mobilegl-linux-runtime-split.tar.zst
          if-no-files-found: error

      # The retrace legs load only the library, and the server image on the spawn arm, so they
      # take this instead of the whole test runtime.
      - name: Package retrace library
        if: steps.guard.outputs.identical != 'true'
        run: |
          files=("${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/libMobileGL.so")
          if [ -f "${BUILD_DIR}/libMobileGLServer.so" ]; then files+=("${BUILD_DIR}/libMobileGLServer.so"); fi
          tar -czf ci-artifacts/mobilegl-linux-lib-split.tgz "${files[@]}"

      - name: Upload retrace library
        if: steps.guard.outputs.identical != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-lib-split
          path: ci-artifacts/mobilegl-linux-lib-split.tgz
          if-no-files-found: error

  # The split lane itself: the three-arm shape ARCHITECTURE.md §13.2 asks for verbatim, plus the
  # first real run of the five MG_Test/Wire suites, plus P5's two exit-gate negative controls.
  integration-split:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: [build-linux-split, build-linux]
    if: ${{ !cancelled() && needs.build-linux-split.result == 'success' && (needs.build-linux-split.outputs.reuse-primary != 'true' || needs.build-linux.result == 'success') }}

    # Short-lived test processes skip the glslang prewarm, as in the test job.
    env:
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"
      SPLIT_REUSE: ${{ needs.build-linux-split.outputs.reuse-primary }}
      SPLIT_BUILD_DIR: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'build-linux' || 'build-split' }}
      SPLIT_RUNTIME: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'mobilegl-linux-runtime' || 'mobilegl-linux-runtime-split' }}
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # The two build guards must agree. build-linux-split skips its compile on its own guard's
      # word; the artifacts these lanes then take are build-linux's, so build-linux's guard must
      # have proved the same equality on the runner that built them.
      - name: Split runtime agreement
        env:
          PRIMARY_IDENTICAL: ${{ needs.build-linux.outputs.split-identical }}
          PRIMARY_RATCHET: ${{ needs.build-linux.outputs.link-ratchet }}
        run: |
          if [ "${SPLIT_REUSE}" = "true" ] && [ "${PRIMARY_IDENTICAL}" != "true" ]; then
            echo "::error::build-linux-split skipped its build, but build-linux's guard did not prove the two configurations equal (split-identical='${PRIMARY_IDENTICAL}'): the runners disagree, so these lanes have no split runtime they can trust"
            exit 1
          fi
          if [ "${SPLIT_REUSE}" = "true" ] && [ "${PRIMARY_RATCHET}" != "success" ]; then
            echo "::error::the server link-closure ratchet ran in build-linux for this reused build and did not pass (outcome '${PRIMARY_RATCHET}'); its link-ratchet artifact names the symbols"
            exit 1
          fi
          echo "split runtime: ${SPLIT_BUILD_DIR} (reuse of build-linux: ${SPLIT_REUSE})"

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Download Linux split runtime
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SPLIT_RUNTIME }}
          path: .

      - name: Unpack Linux split runtime
        run: |
          tar --zstd -xf "${SPLIT_RUNTIME}.tar.zst"
          test -f "${SPLIT_BUILD_DIR}/libMobileGL.so"
          if [ "${SPLIT_REUSE}" = "true" ]; then
            python3 -c 'import json, sys; mode = json.load(open(sys.argv[1]))["mode"]; sys.exit(0 if mode == "disaggregated" else f"build-linux runtime mode is {mode}, not disaggregated")' \
              "${SPLIT_BUILD_DIR}/runtime-mode.json"
          fi

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Spawn/split lane parity (9.2)
        run: python3 scripts/ci/spawn_lane_parity.py "${SPLIT_BUILD_DIR}"

      # P8-A (ID-P8-2): every monolith case, tails normalised, is on a gated split arm or is named
      # with a reason class in scripts/data/split_coverage_exemptions.txt. The same `ctest -N`
      # cost as the parity step above, and the question it cannot answer: parity compares the
      # split arms with EACH OTHER, so a case missing from all three passes it.
      - name: Split coverage against monolith (P8-A)
        run: |
          python3 scripts/ci/split_coverage.py --self-test
          python3 scripts/ci/split_coverage.py "${SPLIT_BUILD_DIR}"

      # P8-SE: PipeCatalogueTest's unmigrated-emulation list equals the MGPipeUnmigratedEmulation
      # call sites in the tree, one site per name. A source lint: no build needed.
      - name: Unmigrated-emulation list against its call sites (P8-SE)
        run: |
          python3 scripts/ci/unmigrated_emulation_sites.py --self-test
          python3 scripts/ci/unmigrated_emulation_sites.py

      # The test job runs the same unit lane, with the same REQUIRE_GPU, on this same build when
      # build-linux-split was reused; the strict unit step in integration-split-strict always runs.
      - name: Unit tests on the split runtime
        if: env.SPLIT_REUSE != 'true'
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
        run: ctest --output-on-failure -L unit --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/unit-split.xml"

      # TcpLane.SupervisorProtocolControls and TcpLane.ControlFrameFuzz build the protocol's Python
      # bindings with flatc, and without one they exit 77 and ctest reports a skip. flatc is not in
      # the build graph (see gen_protocol.py), so this builds the same pinned flatc as flatc-check,
      # and the lane step requires both entries PASSED by name through junit_tally.py. --check keeps
      # this step from regenerating the committed header; checking that header is flatc-check's job.
      - name: Check out FlatBuffers (TCP lane)
        run: git submodule update --init 3rdparty/flatbuffers

      - name: Build pinned flatc (TCP lane)
        run: python3 scripts/gen_protocol.py --build-dir "${RUNNER_TEMP}/flatc-build" --check

      # --no-tests=error is half the gate, exactly as in integration-verify: the integration-split
      # entries exist only when the library was configured with -DMOBILEGL_BUILD_DISAGGREGATED=ON,
      # so a build that lost the option matches nothing and reds here instead of reporting a green
      # run of nothing. The other half is the transport-resolution check below.
      #
      # An entry whose owning package (c1 client, s1 session, v1 server) has not landed SKIPS with
      # the reason and never goes green - MG_IntegrationTest/CMakeLists.txt probes MG_Remote for
      # c0's signature stubs and disarms the lane while any remain.
      - name: Split lanes (inproc, spawn, TCP)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
        run: |
          ulimit -c unlimited
          export MOBILEGL_FLATC_EXECUTABLE="${RUNNER_TEMP}/flatc-build/flatc"
          test -x "${MOBILEGL_FLATC_EXECUTABLE}"
          # The exit code is kept beside the JUnit: the controls step tallies this run as its baseline.
          rc=0
          ctest --output-on-failure -L integration-split --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/split-baseline.xml" || rc=$?
          echo "${rc}" > "${RUNNER_TEMP}/split-baseline.rc"
          [ "${rc}" -eq 0 ] || exit "${rc}"
          python3 ../scripts/ci/junit_tally.py "${RUNNER_TEMP}/split-baseline.xml" --require-split-ran
          # Exit gate 9.3: the spawn arm green at the same count. It runs the same cases through a
          # SECOND PROCESS, so a failure here that the line above did not see is a transport fact
          # and not a phase one - which is the whole reason both lanes exist.
          ctest --output-on-failure -L integration-spawn --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/spawn-baseline.xml"
          # PH-6 / fuzz arm 3: the supervisor-level forfeit control rides this lane and must RUN.
          python3 ../scripts/ci/junit_tally.py "${RUNNER_TEMP}/spawn-baseline.xml" --require-spawn-ran --require-entry-passed SpawnLane.EventForfeitPeer
          ctest --show-only=json-v1 -L '^integration-tcp$' > "${RUNNER_TEMP}/tcp-discovery.json"
          ctest --output-on-failure -L '^integration-tcp$' --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/tcp-baseline.xml"
          python3 ../scripts/ci/junit_tally.py "${RUNNER_TEMP}/tcp-baseline.xml" --require-tcp-ran --require-run-ahead --discovery "${RUNNER_TEMP}/tcp-discovery.json"
          python3 ../scripts/ci/junit_tally.py "${RUNNER_TEMP}/tcp-baseline.xml" --require-entry-passed TcpLane.SupervisorProtocolControls --require-entry-passed TcpLane.EventForfeitPeer --require-entry-passed TcpLane.ControlFrameFuzz

      # THE RUNTIME HALF OF "THIS IS REALLY A SPLIT BUILD". The build-level nm check in
      # build-linux-split proves the library CARRIES MG_Remote; this proves the transport
      # RESOLVED in a process of this lane. ConfigLoader::InitTransport logs one INFO line when it
      # selects InProcess, and the DirectGLES.Split.PersistentMapArm. entry retains its private
      # counting log (all Split entries now have private paths). It runs right after the lane, so
      # it reads the lane's own run rather than a later step's rerun of the same entry.
      # The line is written during bring-up, before any scenario decides to skip, so this
      # check is live from the day the lanes land rather than from the day they stop skipping.
      - name: Transport and default-knob resolution check
        id: resolution
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        run: |
          # P6: the sink writes one file per ROLE from the base MOBILEGL_LOG_FILE_PATH; the
          # transport-resolution line is ConfigLoader's, on the CLIENT thread, so it is in the
          # .client half. The base name itself names no file now.
          log=MobileGL/MG_IntegrationTest/persistent-map-arm-split-DirectGLES.client.log
          if [ ! -f "${log}" ]; then
            echo "::error::${log} does not exist: the DirectGLES.Split.PersistentMapArm. entry never ran (or the per-role split renamed it), so nothing in this job establishes that MOBILEGL_TRANSPORT ever resolved to inproc in a live process"
            exit 1
          fi
          # THE DISTINCTIVE PART OF THE INFO LINE, not the bare KEY=VALUE (review finding M-5):
          # ConfigLoader logs `Config: Accepted env variable: MOBILEGL_TRANSPORT=inproc` for the
          # env dump too, unconditionally and in a PULL build, and at DEBUG that line is live.
          if ! grep -q "MOBILEGL_TRANSPORT=inproc - the MGPipe record stream" "${log}"; then
            echo "::error::${log} carries no transport-resolution line. ConfigLoader::InitTransport logs it at INFO when it selects InProcess, and that code exists only in a MOBILEGL_BUILD_DISAGGREGATED build - so this lane ran a monolith library while claiming to be the split lane. (A bare MOBILEGL_TRANSPORT=inproc substring is NOT accepted: the env dump prints one in every build.)"
            exit 1
          fi
          echo "the split lane resolved MOBILEGL_TRANSPORT=inproc"
          # The IPC knobs every passed entry resolved, from its own client log: the defaults the
          # lane relies on (run-ahead and the role-split state on, strict off) unless the entry
          # pins its own. Proven defaults make Transport A/B below a repeat of the integration
          # job's two legs; exit 3 says a default changed, and A/B then runs.
          ctest -L integration-split --show-only=json-v1 > "${RUNNER_TEMP}/split-lane.json"
          rc=0
          python3 "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" ipc-config \
            "${RUNNER_TEMP}/split-lane.json" "${RUNNER_TEMP}/split-baseline.xml" "${RUNNER_TEMP}/split-ipc.json" \
            strict=0 role-split-state=1 run-ahead=1 --assumed role-split-state,run-ahead || rc=$?
          if [ "${rc}" -eq 0 ]; then
            echo "defaults-on=true" >> "${GITHUB_OUTPUT}"
          elif [ "${rc}" -eq 3 ]; then
            echo "::warning::an IPC default differs from what the lanes assume (split-ipc.json names the entries), so Transport A/B runs"
            echo "defaults-on=false" >> "${GITHUB_OUTPUT}"
          else
            exit "${rc}"
          fi

      # Both full transport runs are hard gates. The per-case comparison below
      # remains diagnostic because explicit mechanism controls retain their own mode.
      # With build-linux reused and the defaults proven above, the integration job's two legs
      # already ran these entries on this library in these configurations, so this is skipped.
      #
      # The entries that name MOBILEGL_TRANSPORT in their OWN property (the Split. lanes) keep
      # their value in both passes, which is correct: they are the split family in both arms and
      # the comparison is about the other 1100.
      - name: Transport A/B (monolith vs inproc)
        if: env.SPLIT_REUSE != 'true' || steps.resolution.outputs.defaults-on != 'true'
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_ITRP_FIX: "ForceOn"
        run: |
          ulimit -c unlimited
          count=$(ctest -N -L integration-gpu | grep -cE '^ *Test *#[0-9]+:')
          if [ "${count}" -lt 1 ]; then
            echo "::error::the split runtime registers ${count} integration-gpu entries"
            exit 1
          fi
          echo "integration-gpu entries in the split build: ${count}"
          MOBILEGL_TRANSPORT=monolith ctest --output-on-failure -L integration-gpu --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/arm-monolith.xml"
          MOBILEGL_TRANSPORT=inproc MOBILEGL_IPC_ROLE_SPLIT_STATE=1 MOBILEGL_IPC_STRICT_ERRORS=1 ctest --output-on-failure -L integration-gpu --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/arm-inproc.xml"
          # Both commands above must succeed; report differences among legitimate skips.
          python3 - "${RUNNER_TEMP}/arm-monolith.xml" "${RUNNER_TEMP}/arm-inproc.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          def rows(path):
              out = {}
              for case in ET.parse(path).getroot().iter('testcase'):
                  status = 'passed'
                  if case.find('failure') is not None or case.find('error') is not None:
                      status = 'failed'
                  elif case.find('skipped') is not None or case.get('status') in ('notrun', 'disabled'):
                      status = 'skipped'
                  out[case.get('name')] = status
              return out
          a, b = rows(sys.argv[1]), rows(sys.argv[2])
          diff = sorted(set(a) ^ set(b)) + sorted(n for n in set(a) & set(b) if a[n] != b[n])
          if diff:
              for name in diff[:40]:
                  print(f"{name}: monolith={a.get(name, '<absent>')} inproc={b.get(name, '<absent>')}")
              print(f"Transport comparison: {len(diff)} name/status differences after both full runs passed")
          else:
              print(f"the two arms agree on all {len(a)} entries, name and status")
          PY

      # Negative controls for the verb barrier (MOBILEGL_IPC_VERB_BARRIER=0) and the persistent-map
      # push (MOBILEGL_IPC_PERSISTENT_BLOCK_KB=0): each knob must turn its selected entries red.
      # The body is scripts/ci/split_negative_controls.sh, so scripts/ci/control_smoke_test.sh can
      # run the same lines off a runner. It needs a green baseline with at least one passed entry,
      # tallied from the lane step's JUnit and exit code (re-run only when that step never ran),
      # and accepts a red only when it carries the control's own diagnostic.
      - name: Negative controls (barrier, map push)
        if: ${{ !cancelled() }}
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          CONTROL_TMPDIR: ${{ runner.temp }}
          SPLIT_BASELINE_JUNIT: ${{ runner.temp }}/split-baseline.xml
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/split_negative_controls.sh"

      # The run log needs a signed-in reader; annotations do not. Name every failed ctest entry,
      # with the lines of its output that say why, where anyone reading the run can see them.
      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py "${RUNNER_TEMP}"

      - name: Upload split lane logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-split-logs
          path: |
            ${{ env.SPLIT_BUILD_DIR }}/MobileGL/MG_IntegrationTest/*.log*
            ${{ env.SPLIT_BUILD_DIR }}/MobileGL/MG_IntegrationTest/split-logs/*.log
            ${{ runner.temp }}/arm-inproc.xml
            ${{ runner.temp }}/arm-monolith.xml
          if-no-files-found: warn

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-split
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-split-core-dumps
          path: /tmp/core.*
          if-no-files-found: ignore

  # Shares build-linux-split with the functional/transport job above. This job
  # checks state ownership: strict residual-read rules, distinct client/server
  # blocks, zero-residual assertions, and complete per-entry result accounting.
  # Configured controls must pass without skips. Capability gaps and known
  # limitations are reported separately and accepted only by exact name/reason.
  integration-split-strict:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [build-linux-split, build-linux]
    if: ${{ !cancelled() && needs.build-linux-split.result == 'success' && (needs.build-linux-split.outputs.reuse-primary != 'true' || needs.build-linux.result == 'success') }}

    # Short-lived test processes skip the glslang prewarm, as in the test job.
    env:
      MOBILEGL_DISABLE_SHADER_PREWARM: "1"
      SPLIT_REUSE: ${{ needs.build-linux-split.outputs.reuse-primary }}
      SPLIT_BUILD_DIR: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'build-linux' || 'build-split' }}
      SPLIT_RUNTIME: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'mobilegl-linux-runtime' || 'mobilegl-linux-runtime-split' }}
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # The two build guards must agree. build-linux-split skips its compile on its own guard's
      # word; the artifacts these lanes then take are build-linux's, so build-linux's guard must
      # have proved the same equality on the runner that built them.
      - name: Split runtime agreement
        env:
          PRIMARY_IDENTICAL: ${{ needs.build-linux.outputs.split-identical }}
          PRIMARY_RATCHET: ${{ needs.build-linux.outputs.link-ratchet }}
        run: |
          if [ "${SPLIT_REUSE}" = "true" ] && [ "${PRIMARY_IDENTICAL}" != "true" ]; then
            echo "::error::build-linux-split skipped its build, but build-linux's guard did not prove the two configurations equal (split-identical='${PRIMARY_IDENTICAL}'): the runners disagree, so these lanes have no split runtime they can trust"
            exit 1
          fi
          echo "split runtime: ${SPLIT_BUILD_DIR} (reuse of build-linux: ${SPLIT_REUSE})"

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers vulkan-validationlayers

      - name: Download Linux split runtime
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SPLIT_RUNTIME }}
          path: .

      - name: Unpack Linux split runtime
        run: |
          tar --zstd -xf "${SPLIT_RUNTIME}.tar.zst"
          test -f "${SPLIT_BUILD_DIR}/libMobileGL.so"
          if [ "${SPLIT_REUSE}" = "true" ]; then
            python3 -c 'import json, sys; mode = json.load(open(sys.argv[1]))["mode"]; sys.exit(0 if mode == "disaggregated" else f"build-linux runtime mode is {mode}, not disaggregated")' \
              "${SPLIT_BUILD_DIR}/runtime-mode.json"
          fi

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Unit tests on the split runtime (strict)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
        run: ctest --output-on-failure -L unit --no-tests=error -j "$(nproc)" --output-junit "${RUNNER_TEMP}/unit-strict.xml"

      # ---- Strict split lane: residual pulls under MOBILEGL_IPC_STRICT_ERRORS=1 ----
      #
      # An unbarriered pull is always fatal, and strict also stops any barriered pull that is not
      # admitted (ARCHITECTURE.md §9.2.1). The lane must be green, and its markers must match the
      # admitted list and strict-expected-markers.txt in both directions.
      - name: Strict split lane
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
          MOBILEGL_TRANSPORT: "inproc"
        run: |
          ulimit -c unlimited
          helper="${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py"
          expected="${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/strict-expected-markers.txt"

          # THE LOG SET COMES FROM ctest, NOT FROM A DIRECTORY (P5e gl, ID-119). This step used to
          # grep MobileGL/MG_IntegrationTest/split-logs/, which holds 90 of the lane's entries.
          # The 26 it could not see were the F1. readback block, both NamedBlit pairs, the four
          # Ct. entries and PersistentMapArm - i.e. PRECISELY the readback population the
          # allowlist is about, plus the only DirectVulkan entries in the lane. A directory is a
          # guess about where the lane put its logs; `--show-only=json-v1` is the lane saying so.
          ctest -L integration-split --show-only=json-v1 > "${RUNNER_TEMP}/lane.json"

          # Stale logs from an earlier job would be read as this run's evidence: an entry that
          # never starts leaves the previous file in place, and "no marker" is exactly what a
          # lane that never ran looks like.
          python3 - "${RUNNER_TEMP}/lane.json" "${helper}" <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[2])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          logs = slp.marker_log_paths(json.load(open(sys.argv[1])))
          for path in set(logs.values()):
              try:
                  os.unlink(path)
              except OSError:
                  pass
          print(f"reset {len(set(logs.values()))} private log(s) across {len(logs)} entries")
          PY

          rc=0
          ctest -L integration-split --no-tests=error -j 4 --output-junit "${RUNNER_TEMP}/strict-split.xml" \
            > "${RUNNER_TEMP}/strict-split.txt" 2>&1 || rc=$?
          tail -5 "${RUNNER_TEMP}/strict-split.txt"
          echo "strict run: rc=${rc}"

          python3 "${GITHUB_WORKSPACE}/scripts/gen_pipe_field_ownership.py" --print-admitted \
            > "${RUNNER_TEMP}/allowed.txt"
          echo "§7 allowlist (derived): $(wc -l < "${RUNNER_TEMP}/allowed.txt") admitted pair(s)"

          # Every entry must complete, and the census is what says why when one does not: an abort
          # is either an unbarriered pull (§3.3's unconditional Fatal, a missed migration) or a
          # barriered pull nothing admits, and both come out of the census by field and verb.
          if [ "${rc}" -ne 0 ]; then
            echo "::error::integration-split under MOBILEGL_IPC_STRICT_ERRORS=1 is RED on a run-ahead server. CONTRACT-P5E §7 makes this lane a hard green gate; the census below names the field and the verb of every entry that aborted."
            python3 "${helper}" markers "${RUNNER_TEMP}/lane.json" '.' \
              "${RUNNER_TEMP}/allowed.txt" "${expected}" || true
            exit 1
          fi

          # The admitted pairs come from gen_pipe_field_ownership.py --print-admitted, the table
          # MGPipeBarrierPullAdmitted() reads, so this list and the C++ cannot drift. A pair is
          # admitted when its verb has a stamp row, the field is BARRIER_PULLED and in the verb's
          # may-read mask, and either every wire op stamping the verb waits or the field's retiring
          # phase is not the generator's THIS_PHASE. The census fails on an admitted marker outside
          # that list and on any difference from strict-expected-markers.txt in either direction;
          # `no-fatal` adds any Fatal marker. Escalated markers depend on the record's payload (an
          # open XFB span, client vertex arrays), so they are checked only against the expected set.
          python3 "${helper}" markers "${RUNNER_TEMP}/lane.json" '.' \
            "${RUNNER_TEMP}/allowed.txt" "${expected}" no-fatal

          # Arming proof: DirectGLES.Split.StrictArming. runs with MOBILEGL_PIPE_STATS=1 and a
          # private log and asserts, over one drawing frame, that the server stamped a verb
          # boundary (vbs > 0) and that no residual pull happened (rsp == 0). Only that entry
          # enables PipeStats, so the counters are checked there, not grepped from these logs; rsp
          # counts only barriered pulls, as an unbarriered one aborts before CountBarrierPull.
          # This step only requires that the entry ran: a skipped positive control proves nothing.
          if ! grep -q 'DirectGLES\.Split\.StrictArming\.' "${RUNNER_TEMP}/strict-split.txt"; then
            echo "::error::the strict lane did not run DirectGLES.Split.StrictArming., so nothing in this run proves the server ever stamped a verb boundary. A green lane without it is indistinguishable from a lane where strict was never armed (ID-115)."
            exit 1
          fi
          echo "integration-split under strict is GREEN, two-sided, with the arming control present"

      # ---- P5f (f1), P5F-WIRE-COMPLETENESS.md §4: THE DUAL-BLOCK CENSUS LANE ---------------
      #
      # The same integration-split entries (plus Magma's own lane), re-run under
      # These entries own assertions removed from generic transport registrations.
      # Discovery, execution and zero-skip accounting must agree on the exact set.
      - name: Specialized configuration controls
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
        run: |
          helper="${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py"
          ctest --show-only=json-v1 > "${RUNNER_TEMP}/specialized-all.json"
          python3 "${helper}" select-specialized "${RUNNER_TEMP}/specialized-all.json" \
            "${RUNNER_TEMP}/specialized-selected.json" "${RUNNER_TEMP}/specialized-tests.txt"
          ctest --tests-from-file "${RUNNER_TEMP}/specialized-tests.txt" --no-tests=error -j 4 \
            --output-on-failure --output-junit "${RUNNER_TEMP}/specialized.xml"
          python3 "${helper}" specialized-results "${RUNNER_TEMP}/specialized-all.json" \
            "${RUNNER_TEMP}/specialized.xml"

      # MOBILEGL_IPC_ROLE_SPLIT_STATE=1: the client's residual fill writes a client-role block
      # and the backend reads a server-role one, so every BARRIER-PULLED read aborts with a
      # named Fatal{UnmigratedPipeInput, "<field>@<verb>"}. THE RED IS THE CENSUS - it is the
      # machine-checked list of what still depends on the two roles sharing one object, and it
      # is ratcheted two-sided against Harness/dualblock-expected-fatals.txt: a new pair is a
      # debt somebody now owes, a vanished pair must be removed in the commit that retired it.
      # With the census empty, this lane is a hard green gate.
      - name: Dual-block census lane
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_TRANSPORT: "inproc"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
        run: |
          ulimit -c unlimited
          helper="${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py"
          expected="${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/dualblock-expected-fatals.txt"

          ctest -L 'integration-split|integration-magma-split' --show-only=json-v1 \
            > "${RUNNER_TEMP}/dualblock-lane.json"

          # Stale logs from an earlier step would be read as this run's evidence (ID-119's rule).
          python3 - "${RUNNER_TEMP}/dualblock-lane.json" "${helper}" <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[2])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          logs = slp.marker_log_paths(json.load(open(sys.argv[1])))
          for path in set(logs.values()):
              try:
                  os.unlink(path)
              except OSError:
                  pass
          print(f"reset {len(set(logs.values()))} private log(s) across {len(logs)} entries")
          PY

          rc=0
          ctest -L 'integration-split|integration-magma-split' --no-tests=error -j 4 \
            --output-junit "${RUNNER_TEMP}/dualblock.xml" \
            > "${RUNNER_TEMP}/dualblock-split.txt" 2>&1 || rc=$?
          tail -5 "${RUNNER_TEMP}/dualblock-split.txt"
          echo "dual-block census run: rc=${rc}"

          rows=$(awk '!/^[[:space:]]*(#|$)/ { n++ } END { print n+0 }' "${expected}")
          if [ "${rows}" -eq 0 ] && [ "${rc}" -ne 0 ]; then
            echo "::error::empty dual-block census requires ctest success, including infrastructure/execution status"
            exit "${rc}"
          fi
          python3 "${helper}" expect-fatal "${RUNNER_TEMP}/dualblock-lane.json" \
            "${RUNNER_TEMP}/dualblock.xml" "${expected}"

      # The per-frame zero-residual-read case must execute and pass on both backends.
      - name: P5f per-frame zero-residual check
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
        run: |
          ctest -L integration-p5f-rsp --show-only=json-v1 > "${RUNNER_TEMP}/rsp-lane.json"
          ctest -L integration-p5f-rsp --no-tests=error --output-on-failure \
            --output-junit "${RUNNER_TEMP}/rsp.xml"
          python3 "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            require-green "${RUNNER_TEMP}/rsp-lane.json" "${RUNNER_TEMP}/rsp.xml" \
            DirectGLES.Split.P5fRsp.F1WireScenario.EachWireFrameHasZeroResidualPulls \
            DirectVulkan.Split.P5fRsp.F1WireScenario.EachWireFrameHasZeroResidualPulls

      # The mechanism's own negative control (P5F §6): the same named case must be green with
      # the knob on and red - on its own assertion text - with it off.
      - name: Dual-block negative control (P5f f1)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/dualblock_negative_control.sh"

      # ---- MAGMA'S OWN WIRE LANE: FRAMEBUFFER, TEXTURE AND APPLICATION BUFFERS ------------
      #
      # P5f fm: Magma's framebuffer, copy and mipmap verbs consume server records.
      # The label remains separate so both backends' coverage stays explicit.
      - name: Magma split lane (strict, dual-block)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
          MOBILEGL_TRANSPORT: "inproc"
        run: |
          ctest -L integration-magma-split --no-tests=error -j 2 --output-on-failure

      # The Magma scenarios of the step above over the spawn and TCP transports, so a failure here
      # that the inproc step did not show is a two-process fact, not a Magma one. Entries that can
      # run only inproc (such as those that peek this process's server loop) are listed in
      # spawn_lane_parity.py's MAGMA_INPROC_ONLY. The informational tier,
      # integration-magma-all-{split,spawn,tcp}, is not gated: it may go red while CI stays green,
      # and a case moves into a gating step once its blocker is fixed.
      - name: Magma spawn and TCP lanes
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
        run: |
          ulimit -c unlimited
          ctest -L '^integration-magma-spawn$' --no-tests=error -j 2 --output-on-failure
          ctest -L '^integration-magma-tcp$' --no-tests=error -j 2 --output-on-failure

      # Every named Magma application-buffer wire case must execute and pass.
      - name: Magma buffer wire cases (inproc)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        run: |
          ctest -L integration-magma-buffers --show-only=json-v1 > "${RUNNER_TEMP}/magma-buffer-lane.json"
          ctest -L integration-magma-buffers --no-tests=error -j 2 --output-on-failure \
            --output-junit "${RUNNER_TEMP}/magma-buffers.xml"
          python3 - "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            "${RUNNER_TEMP}/magma-buffer-lane.json" "${RUNNER_TEMP}/magma-buffers.xml" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[1])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          cases = [
              "F1WireScenario.EnabledVertexBufferDrawKeepsNamedP7Fatal",
              "F1WireScenario.UniformBufferRangeAndRebindPixels",
              "F1WireScenario.ShortUniformBufferRangePadsMissingBytes",
              "F1WireScenario.SubWordUniformBufferRangePadsMissingBytes",
              "F1WireScenario.UnalignedAtomicCounterRangeDeclinesAndTheSessionLives",
              "F1WireScenario.ComputeWrittenVertexAndIndexBuffersDrawAndReadBack",
              "F1WireScenario.ColorBlitToDefaultIgnoresViewportAndPreservesOrientation",
              "F1WireScenario.ColorBlitToDefaultHonorsScissorAndReversedRect",
              "IndexedDrawFamilyScenario.AnElementBufferDrawElementsOffsetSelectsTheRightQuad",
              "IndexedDrawFamilyScenario.DrawElementsBaseVertexMovesTheSameIndicesToTheOtherQuad",
              "IndexedDrawFamilyScenario.DrawRangeElementsDrawsTheRangedRun",
              "IndexedDrawFamilyScenario.DrawElementsInstancedBaseVertexPaintsOneQuadPerInstance",
              "IndexedDrawFamilyScenario.MultiDrawElementsBaseVertexPaintsEverySubDraw",
              "IndexedDrawFamilyScenario.MultiDrawElementsIndirectDrawsFromTheIndirectBuffer",
              "CrossFrameBufferScenario.VertexBufferSubData",
              "CrossFrameBufferScenario.IndexBufferSubData",
              "CrossFrameBufferScenario.VertexOrphanAndReupload",
              "CrossFrameBufferScenario.IndexOrphanAndReupload",
              "PersistentCoherentMapScenario.TwoWritesThroughTheCoherentPointerEachReachTheirOwnDraw",
              "PersistentCoherentMapScenario.AWriteAfterAFrameBoundaryReachesTheNextFramesDraw",
              "StorageBufferRegrowScenario.AGrownStoreIsVisibleThroughItsExistingIndexedBinding",
              # P11 A2: the >= 16 MiB arena and its tier assertion (emulated).
              "LargeArenaAdoptionScenario.SubDataAfterAnInFlightDrawReachesTheNextDraw",
              "LargeArenaAdoptionScenario.RespecifiedVertexArenaKeepsVaoBindings",
              "LargeArenaAdoptionScenario.RespecifiedIndexArenaKeepsVaoBinding",
              "LargeArenaAdoptionScenario.ReadbackSeesTheLatestCpuWrite",
              "LargeArenaAdoptionScenario.GpuWriteIntoTheArenaIsReadBack",
              "LargeArenaAdoptionScenario.TheArenaLandsInTheTierItsLaneDeclares",
          ]
          slp.require_green(json.load(open(sys.argv[2])), sys.argv[3],
                            ["DirectVulkan.Split.Buffers." + name for name in cases])
          PY

      # P7 package L: THE SAME TWENTY-ONE, BY NAME, IN TWO PROCESSES (nineteen at package L; the
      # sub-word uniform range and the unaligned atomic-counter decline joined later).
      #
      # `--no-tests=error` in the lane step above answers "did something run and pass"; it does
      # not answer "did these twenty-one run". require_green does, and it is the check that would
      # catch the failure mode this package could plausibly introduce - an arm that registers
      # SOME of the lane and goes green on a smaller set. The label spelling is what keeps the
      # three arms apart under `ctest -L`'s regex: the inproc arm keeps the historical
      # `integration-magma-buffers` (which is what the step above require_greens), and the new
      # arms put the arm word FIRST, so neither selection can reach the other.
      #
      # TcpServer.Start / TcpServer.Stop ARE IN THE tcp ARM'S REQUIRED LIST ON PURPOSE. Every
      # tcp entry declares FIXTURES_REQUIRED mobilegl-tcp, so ctest lists the supervisor's two
      # fixture entries under the label as well - and they must be green too: a lane whose
      # supervisor failed to start has nothing to say about the twenty-one.
      - name: Magma buffer wire cases (spawn, TCP)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
        run: |
          for arm in spawn tcp; do
            case "${arm}" in
              spawn) prefix=DirectVulkan.Spawn.Buffers. ;;
              tcp)   prefix=DirectVulkan.Tcp.Buffers. ;;
            esac
            label="integration-magma-${arm}-buffers"
            ctest -L "^${label}$" --show-only=json-v1 > "${RUNNER_TEMP}/magma-buffer-${arm}.json"
            ctest -L "^${label}$" --no-tests=error -j 2 --output-on-failure \
              --output-junit "${RUNNER_TEMP}/magma-buffers-${arm}.xml"
            python3 - "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
              "${RUNNER_TEMP}/magma-buffer-${arm}.json" "${RUNNER_TEMP}/magma-buffers-${arm}.xml" \
              "${prefix}" "${arm}" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[1])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          cases = [
              "F1WireScenario.EnabledVertexBufferDrawKeepsNamedP7Fatal",
              "F1WireScenario.UniformBufferRangeAndRebindPixels",
              "F1WireScenario.ShortUniformBufferRangePadsMissingBytes",
              "F1WireScenario.SubWordUniformBufferRangePadsMissingBytes",
              "F1WireScenario.UnalignedAtomicCounterRangeDeclinesAndTheSessionLives",
              "F1WireScenario.ComputeWrittenVertexAndIndexBuffersDrawAndReadBack",
              "F1WireScenario.ColorBlitToDefaultIgnoresViewportAndPreservesOrientation",
              "F1WireScenario.ColorBlitToDefaultHonorsScissorAndReversedRect",
              "IndexedDrawFamilyScenario.AnElementBufferDrawElementsOffsetSelectsTheRightQuad",
              "IndexedDrawFamilyScenario.DrawElementsBaseVertexMovesTheSameIndicesToTheOtherQuad",
              "IndexedDrawFamilyScenario.DrawRangeElementsDrawsTheRangedRun",
              "IndexedDrawFamilyScenario.DrawElementsInstancedBaseVertexPaintsOneQuadPerInstance",
              "IndexedDrawFamilyScenario.MultiDrawElementsBaseVertexPaintsEverySubDraw",
              "IndexedDrawFamilyScenario.MultiDrawElementsIndirectDrawsFromTheIndirectBuffer",
              "CrossFrameBufferScenario.VertexBufferSubData",
              "CrossFrameBufferScenario.IndexBufferSubData",
              "CrossFrameBufferScenario.VertexOrphanAndReupload",
              "CrossFrameBufferScenario.IndexOrphanAndReupload",
              "PersistentCoherentMapScenario.TwoWritesThroughTheCoherentPointerEachReachTheirOwnDraw",
              "PersistentCoherentMapScenario.AWriteAfterAFrameBoundaryReachesTheNextFramesDraw",
              "StorageBufferRegrowScenario.AGrownStoreIsVisibleThroughItsExistingIndexedBinding",
              "LargeArenaAdoptionScenario.SubDataAfterAnInFlightDrawReachesTheNextDraw",
              "LargeArenaAdoptionScenario.RespecifiedVertexArenaKeepsVaoBindings",
              "LargeArenaAdoptionScenario.RespecifiedIndexArenaKeepsVaoBinding",
              "LargeArenaAdoptionScenario.ReadbackSeesTheLatestCpuWrite",
              "LargeArenaAdoptionScenario.GpuWriteIntoTheArenaIsReadBack",
              "LargeArenaAdoptionScenario.TheArenaLandsInTheTierItsLaneDeclares",
          ]
          required = [sys.argv[4] + name for name in cases]
          if sys.argv[5] == "tcp":
              required += ["TcpServer.Start", "TcpServer.Stop"]
          slp.require_green(json.load(open(sys.argv[2])), sys.argv[3], required)
          PY
          done

      # Run-ahead must queue real GPU work and enforce credits 1 and 3.
      - name: Magma run-ahead cases (credits 1, 3)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        run: |
          ctest -L integration-magma-runahead --show-only=json-v1 > "${RUNNER_TEMP}/magma-runahead-lane.json"
          ctest -L integration-magma-runahead --no-tests=error -j 2 --output-on-failure \
            --output-junit "${RUNNER_TEMP}/magma-runahead.xml"
          python3 - "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            "${RUNNER_TEMP}/magma-runahead-lane.json" "${RUNNER_TEMP}/magma-runahead.xml" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[1])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          cases = [
              "QueuedBufferVersionsAndDeletedNameReuseKeepTheirPixels",
              "QueuedProgramRebindsKeepEachUniformSnapshot",
              "QueuedGpuWritesReadBackTheLastDispatchBytes",
              "MixedNativeAndConvertedGpuVertexStreamsKeepTheirReservation",
              "TextureUploadCannotOvertakeThePreviouslyQueuedDraw",
              "GpuClearSurvivesTheFirstStorageImageUpgrade",
              "PresentCreditActuallyParksTheClientAtItsConfiguredLimit",
          ]
          required = [f"DirectVulkan.Split.RunAhead.Credit{credit}.MagmaRunAheadScenario.{name}"
                      for credit in (1, 3) for name in cases]
          slp.require_green(json.load(open(sys.argv[2])), sys.argv[3], required)
          PY

      # Run-ahead off must go red on the lost queue lead; run-ahead back on must be green.
      - name: Magma run-ahead negative control
        run: |
          python3 scripts/ci/magma_runahead_checks.py negative --build-dir "${SPLIT_BUILD_DIR}" \
            --out "${RUNNER_TEMP}/magma-runahead-negative" --execute

      - name: Magma run-ahead sync validation
        run: |
          python3 scripts/ci/magma_runahead_checks.py validation --build-dir "${SPLIT_BUILD_DIR}" \
            --out "${RUNNER_TEMP}/magma-runahead-syncval" --execute

      - name: Magma view/framebuffer cache sync validation
        run: |
          python3 scripts/ci/magma_cache_checks.py --build-dir "${SPLIT_BUILD_DIR}" \
            --out "${RUNNER_TEMP}/magma-cache-syncval" --execute

      - name: Upload Magma run-ahead and cache evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: magma-runahead-checks
          path: |
            ${{ runner.temp }}/magma-runahead-negative
            ${{ runner.temp }}/magma-runahead-syncval
            ${{ runner.temp }}/magma-cache-syncval
          if-no-files-found: ignore

      # The packed-float chain is generated by a real GPU shader blit, so this entry sits in the
      # integration-magma-split lane with its siblings (CMakeLists.txt's fm loop) and carries
      # their pixels assertion. Its named check survives the flip in the only direction that has
      # evidence behind it: the case must EXECUTE, PASS, and never skip - a lane-level exit code
      # alone would not separate "generated" from "quietly absent".
      - name: Magma packed-float mipmap case (P7)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
          MOBILEGL_TRANSPORT: "inproc"
        run: |
          p7_case='^DirectVulkan\.Split\.Fm\.F1WireScenario\.GenerateMipmapPackedFloatPixels$'
          ctest -R "${p7_case}" --show-only=json-v1 > "${RUNNER_TEMP}/magma-p7-lane.json"
          ctest -R "${p7_case}" --no-tests=error --output-on-failure \
            --output-junit "${RUNNER_TEMP}/magma-p7.xml"
          python3 - "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            "${RUNNER_TEMP}/magma-p7-lane.json" "${RUNNER_TEMP}/magma-p7.xml" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[1])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          name = "DirectVulkan.Split.Fm.F1WireScenario.GenerateMipmapPackedFloatPixels"
          slp.require_green(json.load(open(sys.argv[2])), sys.argv[3], [name])
          PY

      # Client vertex/index inputs are copied into owned wire buffer resources.
      # The original dedicated entries now have to execute successfully with run-ahead.
      - name: Client-array split lane (run-ahead)
        working-directory: ${{ env.SPLIT_BUILD_DIR }}
        env:
          MOBILEGL_ITEST_REQUIRE_GPU: "1"
          MOBILEGL_TRANSPORT: "inproc"
          MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
          MOBILEGL_IPC_STRICT_ERRORS: "1"
          MOBILEGL_IPC_RUN_AHEAD: "1"
        run: |
          ctest -L integration-clientarrays-split --show-only=json-v1 > "${RUNNER_TEMP}/clientarrays-lane.json"
          ctest -L integration-clientarrays-split --no-tests=error --output-on-failure -j 1 \
            --output-junit "${RUNNER_TEMP}/clientarrays.xml"
          python3 - "${GITHUB_WORKSPACE}/MobileGL/MG_IntegrationTest/Harness/split_log_paths.py" \
            "${RUNNER_TEMP}/clientarrays-lane.json" "${RUNNER_TEMP}/clientarrays.xml" <<'PY'
          import importlib.util, json, sys
          spec = importlib.util.spec_from_file_location("slp", sys.argv[1])
          slp = importlib.util.module_from_spec(spec); spec.loader.exec_module(slp)
          lane = json.load(open(sys.argv[2]))
          names = [test["name"] for test in lane["tests"]]
          if not names:
              raise SystemExit("no client-array cases discovered")
          slp.require_green(lane, sys.argv[3], names)
          PY

      # The run log needs a signed-in reader; annotations do not. Name every failed ctest entry,
      # with the lines of its output that say why, where anyone reading the run can see them.
      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py "${RUNNER_TEMP}"

      # P13 W1: every JUnit this job wrote, for the skip census (scripts/ci/skip_census.py).
      - name: Upload JUnit for the skip census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration-split-strict
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: warn

      - name: Upload strict lane logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-split-strict-logs
          path: |
            ${{ env.SPLIT_BUILD_DIR }}/MobileGL/MG_IntegrationTest/*.log*
            ${{ env.SPLIT_BUILD_DIR }}/MobileGL/MG_IntegrationTest/split-logs/*.log
            ${{ runner.temp }}/specialized*.json
            ${{ runner.temp }}/specialized-tests.txt
            ${{ runner.temp }}/specialized.xml
            ${{ runner.temp }}/dualblock-lane.json
            ${{ runner.temp }}/dualblock.xml
            ${{ runner.temp }}/dualblock-split.txt
          if-no-files-found: warn

  # MobileGL/MG_Remote/Protocol/generated/protocol_generated.h is COMMITTED, and
  # flatc is deliberately absent from the default build graph (a codegen step in
  # the graph is how the earlier branch ended up cross-compiling an arm64 flatc
  # and trying to run it on the host). This job is what keeps the committed
  # header honest: build the pinned flatc, regenerate, and fail on any diff.
  # It needs no MobileGL build, so it does not depend on build-linux.
  flatc-check:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Check out the FlatBuffers submodule only
        # Just this one: the schema check has nothing to do with glslang,
        # SPIRV-Cross or the trace fixtures.
        run: git submodule update --init 3rdparty/flatbuffers

      - name: Regenerate protocol_generated.h
        run: python3 scripts/gen_protocol.py --build-dir "${{ runner.temp }}/flatc-build"

      - name: Generated header staleness check
        run: git diff --exit-code -- MobileGL/MG_Remote/Protocol/generated/protocol_generated.h

      # P7 wave 2-F, F fix round (PH-7 (4) review). MOBILEGL_PROTOCOL_CONTROL_REVISION is mixed
      # into wireFingerprint so a control-schema change refuses an old peer by name - but it is a
      # hand-bumped integer, and nothing tied it to protocol.fbs's content. This step pins
      # sha256(protocol.fbs) to the revision (scripts/ci/protocol_revision_pins.json): a schema
      # edit that forgot the bump is red HERE, in the job that regenerates the header on every
      # such edit, and not a silently absent field between an old server and a new client. Its
      # self-test proves the check goes red on both perturbations before it says green.
      - name: Protocol revision pin check
        run: python3 scripts/ci/protocol_revision_pin.py --self-test

  # P0.5 interface-purity gate A (ARCHITECTURE.md §13.2): the two extracted headers' include closure,
  # asserted on `-H` output because `nm --undefined-only` is blind to "included but not called" -
  # a header whose types are never named leaves no symbol behind, and "included at all" is exactly
  # the coupling P1 and P7 have to sever. Needs a preprocessor and three header submodules, no
  # CMake configure and no glslang sources, so like pipe-gates it does not depend on build-linux.
  # The script's own --self-test is always on: a negative control that stopped tripping fails the
  # job, because a gate that cannot go red is not a gate (ARCHITECTURE.md §13.2).
  include-graph-check:
    name: Include-closure purity gate
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Check out header submodules
        # ska/flat_hash_map.hpp, xxhash.h and vulkan/vulkan.h are the only submodule headers
        # Includes.h reaches; glslang and spirv_cross are vendored under include/.
        run: git submodule update --init include/ska 3rdparty/xxHash 3rdparty/Vulkan-Headers

      - name: Install clang and X11 headers
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        # Includes.h defines VK_USE_PLATFORM_XLIB_KHR before <vulkan/vulkan.h>, which then
        # includes <X11/Xlib.h>; without libx11-dev every clang-mode probe dies in the
        # preprocessor and the gate reports 5 problems that have nothing to do with purity.
        run: sudo apt-get update && sudo apt-get install -y clang-20 libx11-dev

      - name: Include-closure check and self-test
        # --expect-probes 5 (contract-v2.md 7.6; P13 W5 adds record-core): an exit code cannot tell five probes from none,
        # so a --probe typo or a manifest edit that selected nothing would run zero probes and
        # exit 0 - the second half of the finding that added the flag. The count is the length of
        # scripts/check_include_closure.py's PROBES list and changing one means changing the other.
        #
        # Use the compiler selected for this runner's installed toolchain.
        run: python3 scripts/check_include_closure.py --mode both --compiler "${MOBILEGL_CI_CXX}" --self-test --require-all --expect-probes 5

  benchmark:
    runs-on: ubuntu-26.04
    needs: [build-linux]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        # libegl-mesa0 is the EGL vendor library itself: DriverBench brings up a
        # real GL context, and libegl1 is only glvnd's dispatch. It normally
        # arrives as a Recommends of libegl1, which is too quiet a dependency for
        # the one job that needs a working driver.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers

      - name: Download Linux runtime
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-runtime
          path: .

      - name: Unpack Linux runtime
        run: tar --zstd -xf mobilegl-linux-runtime.tar.zst

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Benchmark
        working-directory: build-linux
        run: |
          ulimit -c unlimited
          ctest -V -C Release -L benchmark --no-tests=error

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-core-dumps
          path: /tmp/core.*
          if-no-files-found: ignore

  build-retrace:
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    env:
      BUILD_DIR: build-retrace
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      MOBILEGL_LIBRARY: ${{ github.workspace }}/build-linux/libMobileGL.so

    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-

      - name: Prepare Vulkan SDK
        id: netsetup2500
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup2500.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Install dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build

      - name: Show installed toolchain
        run: |
          ccache --version
          "${MOBILEGL_CI_CC}" --version
          "${MOBILEGL_CI_CXX}" --version
          "${MOBILEGL_CI_LLD}" --version
          dpkg -l 'libc++*' 'libegl*' 'libgles*' 'mesa*' 'vulkan*' || true

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Configure CMake
        run: |
          if [ "${{ secrets.ACTIONS_STEP_DEBUG }}" = "true" ]; then
            BUILD_TYPE=Debug
          else
            BUILD_TYPE=Release
          fi

          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_C_COMPILER="${MOBILEGL_CI_CC}" \
            -DCMAKE_CXX_COMPILER="${MOBILEGL_CI_CXX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DMOBILEGL_LOG_ACTIVE_LEVEL=MOBILEGL_LOG_LEVEL_INFO \
            -DMOBILEGL_BUILD_TEST=OFF \
            -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DMOBILEGL_BUILD_TRACE_REPLAY=ON \
            -DMOBILEGL_TRACE_SOFTWARE_RENDERING="${MOBILEGL_CI_SOFTWARE_RENDERING}" \
            -DMOBILEGL_TRACE_REPLAY_MOBILEGL_LIBRARY="${MOBILEGL_LIBRARY}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build trace replay
        run: cmake --build "${BUILD_DIR}" --target mobilegl_trace_replay --parallel "$(nproc)"

      - name: Show ccache stats
        if: ${{ always() }}
        run: ccache --show-stats

      - name: Release superseded ccache entry
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" --ref "${GITHUB_REF}" || true

      - name: Save ccache
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1

      - name: Prepare packaged test metadata
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package trace replay
        run: |
          mkdir -p ci-artifacts
          tar -czf ci-artifacts/mobilegl-trace-replay.tgz \
            build-retrace/.ci-source-root \
            build-retrace/tools/trace_replay/mobilegl_trace_replay \
            build-retrace/tools/trace_replay/CTestTestfile.cmake

      - name: Upload trace replay
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-trace-replay
          path: ci-artifacts/mobilegl-trace-replay.tgz
          if-no-files-found: error

  trace-cases:
    name: trace case matrix
    runs-on: ubuntu-26.04
    env:
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}
    outputs:
      matrix: ${{ steps.trace-cases.outputs.matrix }}
      names: ${{ steps.trace-cases.outputs.names }}
      verify-matrix: ${{ steps.trace-cases.outputs.verify-matrix }}
      split-matrix: ${{ steps.trace-cases.outputs.split-matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # `dl` / exit gate S7. CHEAP AND EARLY, on a job that only reads the tree: it needs no
      # build, so a death that names no family is reported in seconds rather than after the
      # matrix. What it refuses is a std::abort() under MG_Remote/ with no Fatal{Family} marker,
      # and a family word that appeared without being recorded - the vocabulary drifts on
      # purpose or not at all (CONTRACT-P6 5.2's D2 ruling).
      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Fatal census (S7)
        run: python3 scripts/ci/fatal_census.py

      # The decline half of rule I (P7 B3): every WireDeclines.def row has a site, every site a
      # warning-or-error line. Same shape as the census - tree-only, no build. The self-test
      # runs first: its fixtures (a site only in a comment or a string, a log in another
      # branch, an MGLOG_D) must red, so a green audit is one that could have been red.
      - name: Wire declines audit (B3)
        run: |
          python3 scripts/ci/wire_declines_audit.py --self-test
          python3 scripts/ci/wire_declines_audit.py

      - name: Load trace cases
        id: trace-cases
        run: |
          python3 tools/trace_replay/trace_cases.py --self-test-transport-matrices
          matrix_format=github-test-matrix
          if [ "${MOBILEGL_CI_DISAGGREGATED}" = "ON" ]; then matrix_format=github-test-transport-matrix; fi
          echo "matrix=$(python3 tools/trace_replay/trace_cases.py --ci --format "${matrix_format}")" >> "$GITHUB_OUTPUT"
          echo "names=$(python3 tools/trace_replay/trace_cases.py --ci --format names)" >> "$GITHUB_OUTPUT"
          # The subset the verify build retraces ("verify": true in trace_cases.json). It is a
          # SUBSET of the matrix above, so retrace-verify needs no fixtures of its own.
          echo "verify-matrix=$(python3 tools/trace_replay/trace_cases.py --ci --format github-verify-matrix)" >> "$GITHUB_OUTPUT"
          # The split subset: {backend, case, transport} over inproc AND spawn, both backends, for
          # every CI case that has not said `"split": false`. Still a SUBSET of the matrix above,
          # so retrace-split needs no fixtures of its own. P5 shipped it as one case (OpenRA, which
          # the phase gate names); P6 widened it to the whole CI matrix, because every bug the
          # spawn work found was a question about the SERVER's process rather than about one trace.
          # trace_cases.py refuses a `split` case that is not in CI, so the subset stays a subset.
          SPLIT_MATRIX=$(python3 tools/trace_replay/trace_cases.py --ci --format github-split-matrix)
          # AND IT MUST NOT BE EMPTY. An empty `include` is not an error to GitHub - it skips the
          # whole retrace-split job with no red anywhere - so the one way this subset can vanish
          # silently is guarded here. trace_cases.py now also rejects an unknown manifest key, which
          # was the hole: `"splitt": true` loaded clean and emptied the subset (review N-4).
          if [ "$(printf '%s' "${SPLIT_MATRIX}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')" -lt 1 ]; then
            echo "::error::the split retrace subset is EMPTY. 'split' is an OPT-OUT as of P6 - a CI case is in this subset unless it carries \"split\": false - so an empty subset means either every case opted out or the CI matrix itself is empty. Either way retrace-split would be skipped with no red, and exit gate E2 names OpenRA."
            exit 1
          fi
          echo "split-matrix=${SPLIT_MATRIX}" >> "$GITHUB_OUTPUT"

  trace-fixtures:
    name: trace fixture (${{ matrix.case }})
    runs-on: ubuntu-26.04
    needs: [trace-cases]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.trace-cases.outputs.names) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Derive trace fixture cache key
        id: fixture-key
        run: bash .github/scripts/trace-fixture-cache.sh key '${{ matrix.case }}'

      - name: Restore trace fixture cache
        id: fixture-cache
        if: steps.fixture-key.outputs.cacheable == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.fixture-key.outputs.paths }}
          key: ${{ steps.fixture-key.outputs.key }}

      - name: Verify restored trace fixture
        id: fixture-verify
        if: steps.fixture-cache.outputs.cache-hit == 'true'
        run: |
          if bash .github/scripts/trace-fixture-cache.sh verify '${{ matrix.case }}'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cached fixture for ${{ matrix.case }} failed verification; falling back to the download path"
            bash .github/scripts/trace-fixture-cache.sh reset '${{ matrix.case }}'
          fi

      - name: Fetch trace fixture
        if: steps.fixture-verify.outputs.ok != 'true'
        run: bash .github/scripts/fetch-trace-fixture-lfs.sh '${{ matrix.case }}'

      - name: Save trace fixture cache
        if: steps.fixture-key.outputs.cacheable == 'true' && steps.fixture-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.fixture-key.outputs.paths }}
          key: ${{ steps.fixture-key.outputs.key }}

      - name: Stage trace fixture
        run: |
          safe_case="$(printf '%s' '${{ matrix.case }}' | sed 's/[^A-Za-z0-9._-]/_/g')"
          stage_dir="trace-fixtures/${safe_case}"
          mkdir -p "${stage_dir}"
          python3 tools/trace_replay/trace_cases.py --format fixture-files --case '${{ matrix.case }}' |
            while IFS= read -r file; do
              cp "${file}" "${stage_dir}/"
            done

      - name: Upload trace fixture
        uses: actions/upload-artifact@v7
        with:
          name: trace-fixture-${{ matrix.case }}
          path: trace-fixtures/**
          if-no-files-found: error

  retrace:
    name: retrace (${{ matrix.backend }} / ${{ matrix.transport || 'monolith' }}, ${{ matrix.case }})
    runs-on: ubuntu-26.04
    env:
      MOBILEGL_TRANSPORT: ${{ matrix.transport || 'monolith' }}
      MOBILEGL_IPC_ROLE_SPLIT_STATE: "1"
      MOBILEGL_IPC_STRICT_ERRORS: "1"
      MOBILEGL_IPC_RUN_AHEAD: "1"
    needs:
      - build-linux
      - build-retrace
      - trace-cases
      - trace-fixtures
    if: ${{ !cancelled() && needs.build-linux.result == 'success' && needs.build-retrace.result == 'success' && needs.trace-cases.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.trace-cases.outputs.matrix) }}

    steps:
      - name: Set swap space
        if: runner.environment != 'self-hosted'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Download trace fixture
        uses: actions/download-artifact@v8
        with:
          name: trace-fixture-${{ matrix.case }}
          path: trace-fixture-download

      - name: Install trace fixture
        run: |
          mkdir -p tools/trace_replay/fixtures
          find trace-fixture-download -type f -exec cp {} tools/trace_replay/fixtures/ \;

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so
          test -e /usr/lib/x86_64-linux-gnu/libGLESv2.so

      - name: Download Linux library
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-lib
          path: .

      - name: Download trace replay
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-trace-replay
          path: .

      - name: Unpack retrace runtime
        run: |
          tar -xzf mobilegl-linux-lib.tgz
          tar -xzf mobilegl-trace-replay.tgz
          test -f build-linux/libMobileGL.so
          test -f build-retrace/tools/trace_replay/mobilegl_trace_replay

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Retrace and validate
        working-directory: build-retrace/tools/trace_replay
        run: |
          ulimit -c unlimited
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ]; then
            export MOBILEGL_MAGMA_R11G11B10F_FALLBACK=1
          fi
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ] \
             && [ '${{ matrix.case }}' = 'minecraft-1.21.4-fabric-iris-iterationrp-in-world' ]; then
            export MOBILEGL_ITRP_FIX=ForceOn
          fi
          # The blended depth-write quirk auto-enables only on Qualcomm, which no CI
          # runner has, so force it on for the OIT case it exists to fix. ForceOn
          # bypasses only the vendor gate, so this exercises the real strip on
          # lavapipe. The Android AVD lane deliberately leaves it off, keeping the
          # unstripped path covered for the same trace.
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ] \
             && [ '${{ matrix.case }}' = 'improved-transparency-minecraft-26.3' ]; then
            export MOBILEGL_MAGMA_DISABLE_BLENDED_DEPTH_WRITE=1
          fi
          ctest -V --no-tests=error -R '^MobileGLTraceReplay\.${{ matrix.case }}\.${{ matrix.backend }}$'             --output-junit "${RUNNER_TEMP}/retrace.xml"
          # A split row's transport assertions ran on this leg and found their evidence.
          if [ "${MOBILEGL_TRANSPORT}" != monolith ]; then
            python3 "${GITHUB_WORKSPACE}/scripts/ci/retrace_split_evidence.py" \
              '${{ matrix.case }}/${{ matrix.backend }}/output/split-evidence.txt' \
              --transport "${MOBILEGL_TRANSPORT}" --case '${{ matrix.case }}' --backend '${{ matrix.backend }}'
          fi

      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py --excerpts 1 "${RUNNER_TEMP}"

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: retrace-core-dumps-${{ matrix.lane || 'monolith-control' }}-${{ matrix.transport || 'monolith' }}-${{ matrix.backend }}-${{ matrix.case }}
          path: /tmp/core.*
          if-no-files-found: ignore

      - name: Upload actual image
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: retrace-result-${{ matrix.lane || 'monolith-control' }}-${{ matrix.transport || 'monolith' }}-${{ matrix.backend }}-${{ matrix.case }}
          path: |
            build-retrace/tools/trace_replay/${{ matrix.case }}/actual-images/**
            build-retrace/tools/trace_replay/${{ matrix.case }}/${{ matrix.backend }}/output/**
          if-no-files-found: warn

  retrace-summary:
    name: retrace summary
    runs-on: ubuntu-26.04
    needs: [retrace]
    if: ${{ !cancelled() && needs.retrace.result != 'skipped' }}
    env:
      MOBILEGL_CI_DISAGGREGATED: ${{ (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && 'ON' || 'OFF' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Set artifact metadata
        run: |
          echo "date_today=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download monolith control results
        uses: actions/download-artifact@v8
        with:
          pattern: retrace-result-monolith-control-monolith-*
          path: retrace-artifacts/monolith-control

      - name: Download inproc acceptance results
        if: env.MOBILEGL_CI_DISAGGREGATED == 'ON'
        uses: actions/download-artifact@v8
        with:
          pattern: retrace-result-inproc-acceptance-inproc-*
          path: retrace-artifacts/inproc-acceptance

      - name: Render monolith control summary
        run: |
          node tools/trace_replay/render_retrace_summary.mjs \
            --input retrace-artifacts/monolith-control \
            --output-dir retrace-summary/monolith-control \
            --title "MobileGL Linux monolith control" \
            --group-label "Linux / monolith control" \
            --html mobilegl-linux-monolith-control.html

      - name: Render inproc acceptance summary
        if: env.MOBILEGL_CI_DISAGGREGATED == 'ON'
        run: |
          node tools/trace_replay/render_retrace_summary.mjs \
            --input retrace-artifacts/inproc-acceptance \
            --output-dir retrace-summary/inproc-acceptance \
            --title "MobileGL Linux inproc acceptance" \
            --group-label "Linux / inproc acceptance" \
            --html mobilegl-linux-inproc-acceptance.html

      - name: Upload monolith control summary
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-monolith-control-summary-${{ github.sha }}
          path: retrace-summary/monolith-control/mobilegl-linux-monolith-control.html
          archive: false
          if-no-files-found: error

      - name: Upload inproc acceptance summary
        if: env.MOBILEGL_CI_DISAGGREGATED == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-inproc-acceptance-summary-${{ github.sha }}
          path: retrace-summary/inproc-acceptance/mobilegl-linux-inproc-acceptance.html
          archive: false
          if-no-files-found: error

  # The trace half of the third CI mode. Same replay, same goldens, but the library underneath is
  # the verify build and MOBILEGL_PIPE_VERIFY=1 is in the environment, so every backend read of
  # frontend state is checked against a snapshot taken at the verb boundary. Eight cases rather
  # than the full lane's 40 (tools/trace_replay/trace_cases.json, "verify": true): the comparator
  # is budgeted at 5-10x, and the full sweep is a phase-exit / workflow_dispatch run.
  retrace-verify:
    name: retrace verify (${{ matrix.backend }}, ${{ matrix.case }})
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    needs:
      - build-linux-verify
      - build-retrace
      - trace-cases
      - trace-fixtures
    if: ${{ !cancelled() && needs.build-linux-verify.result == 'success' && needs.build-retrace.result == 'success' && needs.trace-cases.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.trace-cases.outputs.verify-matrix) }}

    steps:
      - name: Set swap space
        if: runner.environment != 'self-hosted'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Download trace fixture
        uses: actions/download-artifact@v8
        with:
          name: trace-fixture-${{ matrix.case }}
          path: trace-fixture-download

      - name: Install trace fixture
        run: |
          mkdir -p tools/trace_replay/fixtures
          find trace-fixture-download -type f -exec cp {} tools/trace_replay/fixtures/ \;

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so
          test -e /usr/lib/x86_64-linux-gnu/libGLESv2.so

      - name: Download Linux verify library
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-lib-verify
          path: .

      - name: Download trace replay
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-trace-replay
          path: .

      - name: Unpack verify runtime (library under test)
        # build-retrace's CTestTestfile.cmake has the absolute path
        # <workspace>/build-linux/libMobileGL.so frozen into every case, so the swap happens here
        # rather than through a variable: the verify .so is put where that path points. The nm
        # check is what makes the swap falsifiable - a run against the ordinary library would
        # carry no comparator, ignore MOBILEGL_PIPE_VERIFY entirely, and match its golden.
        #
        # `nm`, not `nm -D`, for the reason spelled out in build-linux-verify: everything MGPipe is
        # hidden-visibility in a Release build and the dynamic table has none of it.
        run: |
          tar -xzf mobilegl-linux-lib-verify.tgz
          tar -xzf mobilegl-trace-replay.tgz
          test -f build-verify/libMobileGL.so
          test -f build-retrace/tools/trace_replay/mobilegl_trace_replay
          mkdir -p build-linux
          cp build-verify/libMobileGL.so build-linux/libMobileGL.so
          if ! nm --defined-only build-linux/libMobileGL.so | grep -q MGPipeVerifyInputs; then
            echo "::error::the library unpacked at build-linux/libMobileGL.so defines no MGPipeVerifyInputs, so this retrace would replay against a comparator-free build and pass on its golden having verified nothing"
            exit 1
          fi
          echo "the library at build-linux/libMobileGL.so is the verify build"

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      - name: Retrace and validate (verify)
        working-directory: build-retrace/tools/trace_replay
        # run_trace_case.cmake turns MOBILEGL_PIPE_VERIFY into three assertions of its own (the
        # arming line, no Fatal{PipeVerifyDiffer, no Fatal{UnmigratedPipeInput), so a case that
        # somehow ran the wrong library reds here instead of passing on its golden.
        # --timeout 10800: the 1800s cases run 5-10x slower with both comparator arms live, which
        # is well past ctest's 1500s default.
        run: |
          ulimit -c unlimited
          export MOBILEGL_PIPE_VERIFY=1
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ]; then
            export MOBILEGL_MAGMA_R11G11B10F_FALLBACK=1
          fi
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ] \
             && [ '${{ matrix.case }}' = 'improved-transparency-minecraft-26.3' ]; then
            export MOBILEGL_MAGMA_DISABLE_BLENDED_DEPTH_WRITE=1
          fi
          ctest -V --no-tests=error --timeout 10800 \
            -R '^MobileGLTraceReplay\.${{ matrix.case }}\.${{ matrix.backend }}$'

      # The retrace lane's own always-on negative control, on one case so it costs one short trace:
      # with a snapshot field corrupted, the SAME replay must fail. Without it, "40 traces, zero
      # divergences" would be a statement about a comparator nobody watched.
      #
      # The rerun replays into the SAME case directory, so the verified run's images are put aside
      # first and restored before the verdict: "Upload actual image" below runs `if: always()` and
      # would otherwise ship the deliberately corrupted run's output under the name of the good one.
      # The restore happens whichever way the control goes, which is why the ctest exit status is
      # captured rather than tested inline.
      - name: Negative control (corrupted snapshot)
        if: ${{ matrix.case == 'OpenRA' && matrix.backend == 'DirectGLES' }}
        working-directory: build-retrace/tools/trace_replay
        run: |
          export MOBILEGL_PIPE_VERIFY=1
          export MOBILEGL_PIPE_VERIFY_CORRUPT=GetRenderStateParameters
          GOOD_OUTPUT="${RUNNER_TEMP}/openra-verified-output"
          rm -rf "${GOOD_OUTPUT}"
          if [ -d OpenRA ]; then
            cp -a OpenRA "${GOOD_OUTPUT}"
          fi
          set +e
          ctest -V --no-tests=error --timeout 10800 \
            -R '^MobileGLTraceReplay\.OpenRA\.DirectGLES$' 2>&1 | tee "${RUNNER_TEMP}/verify-control.txt"
          control_rc=${PIPESTATUS[0]}
          set -e
          if [ -d "${GOOD_OUTPUT}" ]; then
            rm -rf OpenRA
            mv "${GOOD_OUTPUT}" OpenRA
            echo "restored the verified run's OpenRA output over the corrupted rerun's"
          fi
          if [ "${control_rc}" -eq 0 ]; then
            echo "::error::MOBILEGL_PIPE_VERIFY_CORRUPT=GetRenderStateParameters left the OpenRA retrace GREEN, so the comparator is not comparing and the whole verify retrace lane proves nothing."
            exit 1
          fi
          # Its own red: ctest -V prefixes every line with the test number, and CMake re-wraps text.
          if ! sed -E 's/^[0-9]+: //' "${RUNNER_TEMP}/verify-control.txt" | tr -s '[:space:]' ' ' \
               | grep -qF 'Fatal{PipeVerifyDiffer, "GetRenderStateParameters@'; then
            echo "::error::the corrupted-snapshot retrace went red without Fatal{PipeVerifyDiffer, \"GetRenderStateParameters@...\"}: something other than the comparator failed it"
            exit 1
          fi
          echo "the corrupted field turned the retrace red, as it must (ctest exit ${control_rc})"

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: retrace-verify-core-dumps-${{ matrix.backend }}-${{ matrix.case }}
          path: /tmp/core.*
          if-no-files-found: ignore

      - name: Upload actual image
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: retrace-verify-result-${{ matrix.backend }}-${{ matrix.case }}
          path: |
            build-retrace/tools/trace_replay/${{ matrix.case }}/actual-images/**
            build-retrace/tools/trace_replay/${{ matrix.case }}/${{ matrix.backend }}/output/**
          if-no-files-found: warn

  # Trace retrace on the split library: the retrace-verify shape with MOBILEGL_TRANSPORT set
  # instead of MOBILEGL_PIPE_VERIFY, over {backend, case, transport} with inproc and spawn.
  # inproc is the control and spawn the claim: same library and picture, only the server role's
  # process differs, so a spawn-only failure is a transport fact. It runs the unchanged ctest
  # names with MOBILEGL_TRANSPORT exported around ctest, since build-retrace does not register the
  # split variant entries. SSIM cannot catch a monolith run (OpenRA scores 1.000 either way); the
  # guards are the nm check for MG_Remote, run_trace_case.cmake's transport assertions (and, on
  # OpenRA, its wire-volume assertion), and the per-leg check of the evidence file they leave.
  retrace-split:
    name: retrace split (${{ matrix.backend }} / ${{ matrix.transport }}, ${{ matrix.case }})
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    # The setup action selects lavapipe on GitHub-hosted runners.
    needs:
      - build-linux-split
      - build-linux
      - build-retrace
      - trace-cases
      - trace-fixtures
    if: ${{ !cancelled() && needs.build-linux-split.result == 'success' && needs.build-retrace.result == 'success' && needs.trace-cases.result == 'success' && (needs.build-linux-split.outputs.reuse-primary != 'true' || needs.build-linux.result == 'success') }}
    env:
      SPLIT_REUSE: ${{ needs.build-linux-split.outputs.reuse-primary }}
      SPLIT_LIB: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'mobilegl-linux-lib' || 'mobilegl-linux-lib-split' }}
      SPLIT_LIB_DIR: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'build-linux' || 'build-split' }}
      SPLIT_BUILD_DIR: ${{ needs.build-linux-split.outputs.reuse-primary == 'true' && 'build-linux' || 'build-split' }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.trace-cases.outputs.split-matrix) }}

    steps:
      - name: Set swap space
        if: runner.environment != 'self-hosted'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v6

      # The two build guards must agree. build-linux-split skips its compile on its own guard's
      # word; the artifacts these lanes then take are build-linux's, so build-linux's guard must
      # have proved the same equality on the runner that built them.
      - name: Split runtime agreement
        env:
          PRIMARY_IDENTICAL: ${{ needs.build-linux.outputs.split-identical }}
          PRIMARY_RATCHET: ${{ needs.build-linux.outputs.link-ratchet }}
        run: |
          if [ "${SPLIT_REUSE}" = "true" ] && [ "${PRIMARY_IDENTICAL}" != "true" ]; then
            echo "::error::build-linux-split skipped its build, but build-linux's guard did not prove the two configurations equal (split-identical='${PRIMARY_IDENTICAL}'): the runners disagree, so these lanes have no split runtime they can trust"
            exit 1
          fi
          echo "split runtime: ${SPLIT_BUILD_DIR} (reuse of build-linux: ${SPLIT_REUSE})"

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Download trace fixture
        uses: actions/download-artifact@v8
        with:
          name: trace-fixture-${{ matrix.case }}
          path: trace-fixture-download

      - name: Install trace fixture
        run: |
          mkdir -p tools/trace_replay/fixtures
          find trace-fixture-download -type f -exec cp {} tools/trace_replay/fixtures/ \;

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so
          test -e /usr/lib/x86_64-linux-gnu/libGLESv2.so

      - name: Download Linux split library
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SPLIT_LIB }}
          path: .

      - name: Download trace replay
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-trace-replay
          path: .

      - name: Unpack split runtime (library under test)
        # build-retrace's CTestTestfile.cmake has the absolute path
        # <workspace>/build-linux/libMobileGL.so frozen into every case, so the swap happens here
        # rather than through a variable, exactly as in retrace-verify. `nm`, not `nm -D`.
        run: |
          tar -xzf "${SPLIT_LIB}.tgz"
          tar -xzf mobilegl-trace-replay.tgz
          test -f "${SPLIT_LIB_DIR}/libMobileGL.so"
          test -f build-retrace/tools/trace_replay/mobilegl_trace_replay
          if [ "${SPLIT_LIB_DIR}" != build-linux ]; then
            mkdir -p build-linux
            cp "${SPLIT_LIB_DIR}/libMobileGL.so" build-linux/libMobileGL.so
          fi
          if ! nm --defined-only build-linux/libMobileGL.so | grep -q -i MG_Remote; then
            echo "::error::the library unpacked at build-linux/libMobileGL.so defines no MG_Remote symbol, so this retrace would replay against a monolith build, ignore MOBILEGL_TRANSPORT entirely and match its golden having split nothing"
            exit 1
          fi
          echo "the library at build-linux/libMobileGL.so is the split build"

      - name: Prepare downloaded test metadata
        run: |
          for root in build-linux build-verify build-split build-verify-split build-retrace; do
            if [ -d "$root" ]; then python3 scripts/ci/prepare_test_runtime.py "$root"; fi
          done

      # THE SPAWN ARM NEEDS A SECOND BINARY and the inproc arm needs none, which is the whole
      # difference between the two at this level: inproc's server role is a thread in the replay
      # process, spawn's is a PROCESS the client launches from this image. It ships in
      # the split retrace library - libMobileGLServer.so is an executable that wears a
      # .so name so an APK will install it somewhere exec-able - and a missing one must be a NAMED
      # failure here rather than a LaunchServer refusal 78 jobs deep.
      - name: Place the server image (spawn arm only)
        if: ${{ matrix.transport == 'spawn' }}
        run: |
          if [ ! -f "${SPLIT_LIB_DIR}/libMobileGLServer.so" ]; then
            echo "::error::the split runtime carries no libMobileGLServer.so, so transport=spawn has no server to launch. ConfigLoader would resolve Spawn, LaunchServer would refuse BY NAME, and this job would red on a message about an unresolvable image rather than about a packaging gap."
            exit 1
          fi
          if [ "${SPLIT_LIB_DIR}" != build-linux ]; then
            cp "${SPLIT_LIB_DIR}/libMobileGLServer.so" build-linux/libMobileGLServer.so
          fi
          chmod +x build-linux/libMobileGLServer.so
          echo "server image: $(readlink -f build-linux/libMobileGLServer.so)"

      # The Magma knobs go to $GITHUB_ENV rather than to one step's shell, so every later step of
      # this leg runs the same repair set as the replay.
      - name: Magma repair knobs (all later steps)
        run: |
          # P7 package L: THE SAME MAGMA KNOBS THE MONOLITH RETRACE JOB EXPORTS, ALL OF THEM.
          # This job exported none at all, so every DirectVulkan row of the split matrix was
          # compared against a monolith row running a different repair set - and a split retrace
          # whose control is not comparable cannot say whether a divergence is a transport fact.
          # R11F_G11F_B10F fallback is whole-backend; the blended depth-write quirk auto-enables
          # only on Qualcomm, which no runner has, so the OIT case forces it exactly as the
          # monolith job does (ForceOn bypasses only the vendor gate).
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ]; then
            echo "MOBILEGL_MAGMA_R11G11B10F_FALLBACK=1" >> "${GITHUB_ENV}"
          fi
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ] \
             && [ '${{ matrix.case }}' = 'improved-transparency-minecraft-26.3' ]; then
            echo "MOBILEGL_MAGMA_DISABLE_BLENDED_DEPTH_WRITE=1" >> "${GITHUB_ENV}"
          fi
          # THE THREE ITERATIONRP KNOBS, FOR THE ONE CASE THE MONOLITH JOB NAMES.
          # The iterationRP repairs are tri-state quirks that default to device auto-detection and
          # lavapipe is on no auto list, so without them Program 203 runs unrepaired and misses its
          # golden output. The monolith job has exported them since they landed; this job never
          # did, so `iterationrp x DirectVulkan` was the one cell of the split matrix whose red
          # could not be read as a transport fact - the monolith control it is compared against was
          # running a different repair set. Exit gate 1 asks for the two halves to be COMPARABLE,
          # and two runs that differ in a quirk knob are not.
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ] \
             && [ '${{ matrix.case }}' = 'minecraft-1.21.4-fabric-iris-iterationrp-in-world' ]; then
            echo "MOBILEGL_ITRP_FIX=ForceOn" >> "${GITHUB_ENV}"
          fi

      - name: Retrace and validate (${{ matrix.transport }})
        working-directory: build-retrace/tools/trace_replay
        # run_trace_case.cmake turns MOBILEGL_TRANSPORT into assertions of its own - the library
        # must have RESOLVED the transport in this process, and its log must carry no Fatal{ - so a
        # case that somehow ran the wrong library reds here instead of passing on its golden. That
        # log is also the only valid refusal census: the console sink is compiled out of this
        # configuration, so a `ctest -V` transcript reports a false zero for Fatal{ lines.
        run: |
          ulimit -c unlimited
          export MOBILEGL_TRANSPORT='${{ matrix.transport }}'
          # Absolute, because the replay's working directory is not this one and LaunchServer
          # resolves the image relative to nothing. Harmless on the inproc arm, which reads it
          # only to decide it does not need it.
          export MOBILEGL_IPC_SERVER_PATH="${GITHUB_WORKSPACE}/build-linux/libMobileGLServer.so"
          # OpenRA's legs also count the wire's draw records and the server's draws; that turns on
          # the library's per-frame counters, so the other cases keep the plain configuration.
          wire=()
          if [ '${{ matrix.case }}' = 'OpenRA' ]; then
            export MGTRACE_WIRE_EVIDENCE=1
            wire=(--require-wire)
          fi
          ctest -V --no-tests=error --timeout 10800 \
            -R '^MobileGLTraceReplay\.${{ matrix.case }}\.${{ matrix.backend }}$'
          # The transport assertions ran on this leg and found their evidence.
          python3 "${GITHUB_WORKSPACE}/scripts/ci/retrace_split_evidence.py" \
            '${{ matrix.case }}/${{ matrix.backend }}/output/split-evidence.txt' \
            --transport '${{ matrix.transport }}' --case '${{ matrix.case }}' \
            --backend '${{ matrix.backend }}' "${wire[@]}"

      # The refusal census, recorded rather than gated. run_trace_case.cmake already REDS the case
      # on any Fatal{, so reaching here means the count is zero - but the number and the distinct
      # slot names are what MEASUREMENTS wants from every split run, and reading them out of the
      # library's own log is the only way to get them (ctest -V's transcript is a false zero).
      - name: Refusal census from the library log
        if: ${{ always() }}
        working-directory: build-retrace/tools/trace_replay
        run: |
          # BOTH ROLES, because under spawn every applier refusal is raised in the SERVER's
          # process and a census reading only the client's file reports a confident zero for the
          # half it cannot see.
          log="${{ matrix.case }}/${{ matrix.backend }}/output/mobilegl.client.log"
          server_log="${{ matrix.case }}/${{ matrix.backend }}/output/mobilegl.server.log"
          cat "${{ matrix.case }}/${{ matrix.backend }}/output/split-evidence.txt" 2>/dev/null || echo "no split-evidence.txt"
          if [ ! -f "${log}" ]; then
            echo "no ${log} - the replay wrote no library log"
            exit 0
          fi
          census_files="${log}"
          if [ -f "${server_log}" ]; then census_files="${census_files} ${server_log}"; fi
          echo "census over: ${census_files}"
          echo "Fatal{ lines: $(cat ${census_files} | grep -c 'Fatal{' || true)"
          cat ${census_files} | grep -o 'Fatal{[A-Za-z]*, "[^"]*"' | sort | uniq -c | sort -rn | head -20 || true
          # The transport line is the CLIENT's: ConfigLoader resolves it there, and under spawn
          # the server states its own separately.
          grep -m1 "MOBILEGL_TRANSPORT=" "${log}" || echo "no transport line in ${log}"

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: retrace-split-core-dumps-${{ matrix.transport }}-${{ matrix.backend }}-${{ matrix.case }}
          path: /tmp/core.*
          if-no-files-found: ignore

      - name: Upload actual image
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: retrace-split-result-${{ matrix.transport }}-${{ matrix.backend }}-${{ matrix.case }}
          path: |
            build-retrace/tools/trace_replay/${{ matrix.case }}/actual-images/**
            build-retrace/tools/trace_replay/${{ matrix.case }}/${{ matrix.backend }}/output/**
          if-no-files-found: warn

  # The shipped library, replayed. build-linux-monolith-control's library has no MG_Remote, the
  # shape FCL embeds; on the disaggregation branches nothing else replays that shape, so it runs
  # there only (elsewhere the retrace job's library is that shape). One short case on both
  # backends, with no transport set, must match its golden like any monolith row.
  retrace-shipped:
    name: retrace shipped library (${{ matrix.backend }}, ${{ matrix.case }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs:
      - build-linux-monolith-control
      - build-retrace
      - trace-fixtures
    if: ${{ !cancelled() && (github.ref_name == 'feat/disaggregated' || github.ref_name == 'codex/fix-github-ci' || github.ref_name == 'cleanup') && needs.build-linux-monolith-control.result == 'success' && needs.build-retrace.result == 'success' && needs.trace-fixtures.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix:
        backend: [DirectGLES, DirectVulkan]
        case: [OpenRA]

    steps:
      - name: Set swap space
        if: runner.environment != 'self-hosted'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner
        with:
          gpu: "true"

      - name: Download trace fixture
        uses: actions/download-artifact@v8
        with:
          name: trace-fixture-${{ matrix.case }}
          path: trace-fixture-download

      - name: Install trace fixture
        run: |
          mkdir -p tools/trace_replay/fixtures
          find trace-fixture-download -type f -exec cp {} tools/trace_replay/fixtures/ \;

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Install runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers
          test -e /usr/lib/x86_64-linux-gnu/libEGL.so
          test -e /usr/lib/x86_64-linux-gnu/libGLESv2.so

      - name: Download shipped library
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-linux-monolith-control
          path: .

      - name: Download trace replay
        uses: actions/download-artifact@v8
        with:
          name: mobilegl-trace-replay
          path: .

      # build-retrace froze <workspace>/build-linux/libMobileGL.so into every case, so the library
      # is put where that path points, as retrace-verify does. `nm`, not `nm -D`: the MG_Remote
      # symbols are hidden in a Release build and only the static table lists them.
      - name: Unpack shipped library (library under test)
        run: |
          tar -xzf mobilegl-linux-monolith-control.tgz
          tar -xzf mobilegl-trace-replay.tgz
          test -f build-push-control/libMobileGL.so
          test -f build-retrace/tools/trace_replay/mobilegl_trace_replay
          mkdir -p build-linux
          cp build-push-control/libMobileGL.so build-linux/libMobileGL.so
          defined=$(nm --defined-only build-linux/libMobileGL.so | wc -l)
          remote=$(nm --defined-only build-linux/libMobileGL.so | grep -c -i MG_Remote || true)
          if [ "${defined}" -lt 1000 ] || [ "${remote}" -ne 0 ]; then
            echo "::error::build-linux/libMobileGL.so defines ${defined} symbols and ${remote} MG_Remote symbol(s): it is not the shipped shape (no MG_Remote, not stripped)"
            exit 1
          fi
          echo "the library at build-linux/libMobileGL.so is the shipped shape (${defined} defined symbols, no MG_Remote)"

      - name: Prepare downloaded test metadata
        run: python3 scripts/ci/prepare_test_runtime.py build-retrace

      - name: Retrace and validate
        working-directory: build-retrace/tools/trace_replay
        run: |
          ulimit -c unlimited
          if [ '${{ matrix.backend }}' = 'DirectVulkan' ]; then
            export MOBILEGL_MAGMA_R11G11B10F_FALLBACK=1
          fi
          ctest -V --no-tests=error -R '^MobileGLTraceReplay\.${{ matrix.case }}\.${{ matrix.backend }}$' \
            --output-junit "${RUNNER_TEMP}/retrace.xml"

      - name: Annotate failed entries
        if: failure()
        run: python3 scripts/ci/junit_annotate.py --excerpts 1 "${RUNNER_TEMP}"

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: retrace-shipped-core-dumps-${{ matrix.backend }}-${{ matrix.case }}
          path: /tmp/core.*
          if-no-files-found: ignore

      - name: Upload actual image
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: retrace-shipped-result-${{ matrix.backend }}-${{ matrix.case }}
          path: |
            build-retrace/tools/trace_replay/${{ matrix.case }}/actual-images/**
            build-retrace/tools/trace_replay/${{ matrix.case }}/${{ matrix.backend }}/output/**
          if-no-files-found: warn

  remove-artifact-clutter:
    name: remove artifact clutter
    runs-on: ubuntu-26.04
    # Every retrace job downloads the shared fixtures, so this waits for all of them.
    needs:
      - retrace-summary
      - retrace-verify
      - retrace-split
      - retrace-shipped
    if: ${{ always() }}
    permissions:
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Delete intermediate Linux retrace artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the complete inventories before deleting anything. A failed API
          # request must fail this step, not look like "no failed cases" through
          # an unchecked process substitution.
          # 50 rows per page: the jobs endpoint answers HTTP 502 for 90+ rows on a re-run attempt of a run this size.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=50" \
            --jq '.jobs[] | select((.name | startswith("retrace (")) or (.name | startswith("retrace verify (")) or (.name | startswith("retrace split (")) or (.name | startswith("retrace shipped library ("))) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required") | .name' \
            > "${RUNNER_TEMP}/cleanup-jobs.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("trace-fixture-") or startswith("retrace-result-") or startswith("retrace-split-result-") or startswith("retrace-shipped-result-")) | [.id, .name] | @tsv' \
            > "${RUNNER_TEMP}/cleanup-artifacts.txt"
          declare -A failed_cases=()
          while IFS= read -r job_name; do
            case_name="${job_name#retrace split (*, }"
            case_name="${case_name#retrace shipped library (*, }"
            case_name="${case_name#retrace verify (*, }"
            case_name="${case_name#retrace (*, }"
            case_name="${case_name%)}"
            failed_cases["${case_name}"]=1
          done < "${RUNNER_TEMP}/cleanup-jobs.txt"

          if ((${#failed_cases[@]})); then
            echo "Retaining fixtures and results for failed retrace case(s):"
            printf '  %s\n' "${!failed_cases[@]}"
          else
            echo "All retrace jobs succeeded; no fixtures need to be retained."
          fi

          deleted=0
          retained=0
          while IFS=$'\t' read -r artifact_id artifact_name; do
            keep=0
            if [[ "${artifact_name}" == trace-fixture-* ]]; then
              case_name="${artifact_name#trace-fixture-}"
              if [[ -v "failed_cases[${case_name}]" ]]; then
                keep=1
              fi
            else
              for case_name in "${!failed_cases[@]}"; do
                if [[ "${artifact_name}" == *-"${case_name}" ]]; then keep=1; break; fi
              done
            fi
            if ((keep)); then
              echo "Retaining ${artifact_name} (${artifact_id}) for failed retrace."
              ((retained += 1))
              continue
            fi

            echo "Deleting ${artifact_name} (${artifact_id})"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            ((deleted += 1))
          done < "${RUNNER_TEMP}/cleanup-artifacts.txt"

          echo "Deleted ${deleted} intermediate Linux artifact(s); retained ${retained} failed-retrace artifact(s)."

  pipe-gates:
    name: MGPipe generators and hygiene gates
    runs-on: ubuntu-26.04
    # Deliberately independent of build-linux: these are source-level gates, they take
    # seconds, and a broken build must not hide a drifted interface.

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # The seven generators all read MG_Pipe/*.def, so regenerating and diffing is what
      # keeps the two interface tables, the wire records, the verify comparators, the
      # PipeInputs field ids, the read-inventory coverage and the render-state member list
      # from drifting apart from the catalogue. The generated files are committed
      # deliberately: the build must not depend on python.
      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10
      - name: Test CTest runtime metadata preparation
        run: python3 scripts/ci/test_prepare_test_runtime.py

      - name: Regenerate the MGPipe interface (G1-G7)
        run: |
          python3 scripts/gen_pipe.py
          git diff --exit-code -- MobileGL/MG_Pipe/generated

      # The generators' own negative controls: canned inputs that MUST trip each structural check
      # (a field list that does not cover its struct's members, a verb set that is not the function
      # table's). Regenerating and diffing above cannot see a check that silently stopped
      # checking - a broken gate and a clean tree produce the same green.
      - name: MGPipe generator self-test
        run: python3 scripts/gen_pipe.py --self-test

      # The link seam owns physical storage and keeps link dispatch out of callers.
      - name: Link-seam purity check
        run: python3 scripts/ci/link_seam_purity.py --self-test

      # The same shape for Espryt's re-keyed memos (P3b/P4b, PLAN-PH-P34B-P7.md 1.2). P4a/P5f
      # moved the resolved-binding, sampler-pass, image-sweep, twin-registry, unit-sampler and
      # twin-lookup memos onto {slot, gen} handles and applier serials; the legacy pointer-keyed
      # arms stayed because they are the PULL build's only arms and G1 pins that build's .text.
      # Nothing checked that a NEW frontend-pointer key could not appear outside them.
      #
      # P13 W3b: NO EXEMPTED ARM ANY MORE. The legacy pointer-keyed arms (MOBILEGL_PIPE_LEGACY_MEMOS)
      # retired with the pull build, and the !MOBILEGL_BUILD_DISAGGREGATED arms are compiled into
      # the library FCL embeds, so they get the same rule: no frontend-pointer key in any memo
      # family, in any build.
      #
      # --self-test runs the negative controls and then the real scan in one invocation, as its
      # sibling does; the scan also asserts that every memo family's anchor still matches and
      # that every allow-list entry still suppresses something.
      - name: Espryt memo-key purity check
        run: python3 scripts/ci/espryt_memo_purity.py --self-test

      # P13 W3b: the pull build's switches stay retired - a preprocessor conditional on
      # MOBILEGL_PIPE_PUSH / MOBILEGL_PIPE_LEGACY_MEMOS, or an MGB_CTX spelling, coming back is a
      # red here. --self-test plants each shape first and requires the gate to catch it.
      - name: Retired pull-build switches stay retired (P13)
        run: python3 scripts/ci/retired_switches.py --self-test

      # The same question for the symbol tool the P1 gate is written in terms of.
      - name: Symbol report self-test
        run: python3 scripts/symbol_report.py --self-test

      # Per-draw fprintf/printf instrumentation has repeatedly been committed by accident,
      # once inside a mutex critical section. Nothing under these two trees prints to a
      # stdio stream today - MGLOG_D compiles out in INFO builds and is the only channel
      # they are allowed to use - so this gate starts with no exceptions, and any addition
      # to it needs a reason in the pull request rather than a quiet whitelist entry. The
      # alternation names every stdio spelling, not just the two that were committed:
      # fprintf to either stream, printf, puts, and the iostream pair.
      - name: No stdio in MG_Backend or MG_State
        run: |
          if grep -rnE 'fprintf[[:space:]]*\((stderr|stdout)|(^|[^[:alnum:]_>.])printf[[:space:]]*\(|(^|[^[:alnum:]_>.:])puts[[:space:]]*\(|std::(cout|cerr)' \
              MobileGL/MG_Backend MobileGL/MG_State; then
            echo "::error::stdio instrumentation found; use MGLOG_D (compiled out in INFO builds)"
            exit 1
          fi
          echo "no fprintf(stderr/stdout / printf( / puts( / std::cout|cerr under MobileGL/MG_Backend or MobileGL/MG_State"

      # Dirty-surface completeness (ARCHITECTURE.md §5.2.1). --check fails in both directions: a
      # mutator the scanner finds with no row in MG_Pipe/DirtySurface.def, and a row naming a
      # mutator the scan no longer finds. --self-test feeds canned negative controls and fails if
      # one does not trip, so a check that stopped checking cannot stay green. The scanner matches
      # text; the semantic proof is the verify lane.
      - name: Dirty-surface mapping complete (G9)
        run: |
          python3 scripts/gen_pipe_dirty_surface.py --check
          python3 scripts/gen_pipe_dirty_surface.py --self-test

      # PipeFieldOwnership.inc is written by gen_pipe_field_ownership.py, not gen_pipe.py, so the
      # gen_pipe.py regenerate-and-diff step above does not cover it. The build's static_assert
      # catches only an unclassified row; --check also catches a changed class. No branch guard:
      # every branch needs the committed table to follow from the .def files. Each --self-test
      # control asserts its own message, and a harness control checks that one control's exit is
      # never credited to another.
      - name: Field-ownership table complete (R-7.1)
        run: |
          python3 scripts/gen_pipe_field_ownership.py --check
          python3 scripts/gen_pipe_field_ownership.py --self-test

      # Negative controls must themselves be able to go red (ARCHITECTURE.md §13.2).
      # control_smoke_test.sh runs the split control script against a stubbed ctest: an unrelated
      # failure or an empty selection must make it report FAILED, and the scenarios' real
      # diagnostics must make it report PASSED. The Python tests run the trace and TCP lane tooling
      # on stubs and synthetic data; test_run_trace_case.py feeds run_trace_case.cmake canned logs.
      # No branch guard; no build, GPU or device.
      - name: Control and trace-tool smoke tests (R-16)
        run: |
          bash scripts/ci/control_smoke_test.sh
          python3 scripts/ci/test_trace_infrastructure.py
          python3 scripts/ci/tcp_lane_tools_test.py
          python3 tools/trace_replay/test_run_tcp_matrix.py
          python3 tools/trace_replay/test_compare_actuals.py
          python3 tools/trace_replay/test_run_trace_case.py
          python3 scripts/ci/build_fingerprint.py --self-test
          python3 MobileGL/MG_IntegrationTest/Harness/test_split_log_paths.py
          python3 scripts/ci/transport_pinned.py --self-test

      # Warning only for now: the disaggregation documents are still being written, and a
      # lint that fails a rewrite in progress teaches people to ignore it. It becomes
      # --strict when the documents settle.
      - name: Documentation citation lint
        run: |
          shopt -s nullglob
          documents=(docs/Disaggregated/*.md docs/Disaggregated/design/*.md docs/Disaggregated/guide/*.md)
          if [ ${#documents[@]} -eq 0 ]; then
            echo "no disaggregation documents to check"
            exit 0
          fi
          python3 scripts/check_doc_citations.py "${documents[@]}" || true
  build-linux-verify-split:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    env:
      BUILD_DIR: build-verify-split
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Set swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 32

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # recursive for build-linux-split's reason: MOBILEGL_BUILD_DISAGGREGATED shadows itself
          # back to OFF when 3rdparty/flatbuffers/include is missing.
          submodules: recursive

      - name: Configure runner environment
        uses: ./.github/actions/setup-test-runner

      - name: Get CMake
        timeout-minutes: 15
        uses: lukka/get-cmake@v4.3.3
        with:
          cmakeVersion: 3.31.10

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
          restore-keys: |
            ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-

      - name: Prepare Vulkan SDK
        id: netsetup3726
        continue-on-error: true
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Prepare Vulkan SDK (retry)
        timeout-minutes: 15
        if: ${{ (env.MOBILEGL_CI_NATIVE_GPU != '1') && steps.netsetup3726.outcome == 'failure' }}
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Update glslang external sources
        working-directory: 3rdparty/glslang
        run: python3 update_glslang_sources.py

      - name: Install build and runtime dependencies
        timeout-minutes: 15
        if: env.MOBILEGL_CI_NATIVE_GPU != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang-20 clang++-20 lld-20 libc++-20-dev libc++abi-20-dev libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers ninja-build libvulkan1 libegl1 libegl-mesa0 libgles2 libgl1

      - name: Configure CMake
        # Release/INFO for build-linux-verify's reason, and INFO is load-bearing here for
        # build-linux-split's: ConfigLoader's resolved-transport line is logged at INFO and the
        # arm-proof step below reads it back out of every entry's client log.
        run: |
          cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_C_COMPILER="${MOBILEGL_CI_CC}" \
            -DCMAKE_CXX_COMPILER="${MOBILEGL_CI_CXX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOBILEGL_LOG_ACTIVE_LEVEL=MOBILEGL_LOG_LEVEL_INFO \
            -DMOBILEGL_BUILD_TEST=ON \
            -DMOBILEGL_BUILD_BENCHMARK=OFF \
            -DMOBILEGL_BUILD_INTEGRATION_TEST=ON \
            -DMOBILEGL_ITEST_VK_ICD="${VK_ICD_FILENAMES}" \
            -DMOBILEGL_BUILD_TRACE_REPLAY=OFF \
            -DMOBILEGL_BUILD_DISAGGREGATED=ON \
            -DMOBILEGL_BUILD_DISAGGREGATED_INPROC=ON \
            -DMOBILEGL_PIPE_VERIFY=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)"

      # Both options, both directions of "did it take" - the two jobs this one is the product of
      # each check one of them, and this library has to pass both checks.
      - name: Comparator and MG_Remote symbols
        run: |
          test -f "${BUILD_DIR}/libMobileGL.so"
          defined=$(nm --defined-only "${BUILD_DIR}/libMobileGL.so" | wc -l)
          if [ "${defined}" -lt 1000 ]; then
            echo "::error::nm --defined-only sees only ${defined} symbols in ${BUILD_DIR}/libMobileGL.so - it looks stripped, so the checks below could not have failed honestly"
            exit 1
          fi
          if ! nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -q "MGPipeVerifyInputs"; then
            echo "::error::libMobileGL.so defines no MGPipeVerifyInputs: -DMOBILEGL_PIPE_VERIFY=ON did not take, and the verify-split lane would compare nothing"
            exit 1
          fi
          remote=$(nm --defined-only "${BUILD_DIR}/libMobileGL.so" | grep -c -i "MG_Remote" || true)
          if [ "${remote}" -lt 1 ]; then
            echo "::error::libMobileGL.so defines no MG_Remote symbol: -DMOBILEGL_BUILD_DISAGGREGATED=ON did not take, and every entry would run monolith under a name that says split"
            exit 1
          fi
          echo "libMobileGL.so defines MGPipeVerifyInputs and ${remote} MG_Remote symbol(s) (${defined} defined symbols)"

      - name: Show ccache stats
        if: ${{ always() }}
        run: ccache --show-stats

      - name: Release superseded ccache entry
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1
        run: gh cache delete "${CACHE_KEY}" --ref "${GITHUB_REF}" || true

      - name: Save ccache
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-ubuntu26-cpu-test-${{ github.job }}-ccache-v1

      - name: Prepare packaged test metadata
        run: python3 scripts/ci/prepare_test_runtime.py "${BUILD_DIR}"

      - name: Package verify-split runtime
        run: |
          mkdir -p ci-artifacts
          mapfile -t SHARED_LIBS < <(find "${BUILD_DIR}" -type f \( -name '*.so' -o -name '*.so.*' \) -print | sort)
          tar --exclude='*/CMakeFiles' --exclude='*.o' --exclude='*.a' --exclude='*.ninja*' \
            --exclude='build.ninja' --exclude='cmake_install.cmake' \
            --zstd -cf ci-artifacts/mobilegl-linux-runtime-verify-split.tar.zst \
            "${BUILD_DIR}/.ci-source-root" "${BUILD_DIR}/CTestTestfile.cmake" "${BUILD_DIR}/MobileGL/MG_Test" \
            "${BUILD_DIR}/MobileGL/MG_IntegrationTest" "${SHARED_LIBS[@]}"
      - name: Upload verify-split runtime
        uses: actions/upload-artifact@v7
        with:
          name: mobilegl-linux-runtime-verify-split
          path: ci-artifacts/mobilegl-linux-runtime-verify-split.tar.zst
          if-no-files-found: error

  # P13 W1 (PLAN-P13 §4.2): THE SKIP CENSUS. Deleting a compile-time macro before the GTEST_SKIP
  # or pull stub that guards on it turns tests "green by skipping"; a per-lane pass/fail count
  # cannot see that. Every gtest lane uploads its JUnit as junit-*; this job keys each case by
  # lane and name and holds the run against scripts/data/skip_census_baseline.json: a new skip
  # (pass -> skip included) or a vanished name is red, a skip that turned into a pass is a note.
  # A deliberate retirement edits the baseline in the same commit and names the cases.
  skip-census:
    name: skip census
    runs-on: ubuntu-26.04
    needs:
      - test
      - integration
      - integration-verify
      - integration-verify-split
      - integration-split
      - integration-split-strict
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Skip census self-test
        run: python3 scripts/ci/skip_census.py --self-test
      - name: Download lane JUnit
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: junit
      - name: Skip census
        run: |
          python3 scripts/ci/skip_census.py check junit \
            --baseline scripts/data/skip_census_baseline.json --report skip-census.json
      - name: Upload census
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: skip-census
          path: skip-census.json
          if-no-files-found: warn
